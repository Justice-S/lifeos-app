<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifeOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LifeOS</title>
<style>
:root{
  --bg:#000000; --panel:#141414; --panel2:#1e1e1e; --line:#2c2c2c;
  --text:#f2f2f2; --dim:#9a9a9a; --accent:#ff8a3d; --ink:#1a0f05; --good:#3fb950;
  --warn:#d29922; --bad:#f85149; --radius:14px;
  --warn-bg:rgba(210,153,34,.1); --warn-line:rgba(210,153,34,.35); --warn-text:#f0c674;
  --on-bad:#ffffff; --on-accent:var(--ink);
  --nav-bg:rgba(0,0,0,.93); --scrim:rgba(0,0,0,.6); --scrim-strong:rgba(0,0,0,.55);
  --accent-glow:rgba(255,138,61,.45);
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* #app owns its own scroll (not body/html) so a content-heavy tab like
   Settings doesn't grow the whole document taller than a short one like
   Today — that's what kept the page height and the fixed nav bar's
   position consistent across tabs. Deliberately NOT paired with
   overflow:hidden on html/body, though: that combination is a known iOS
   Safari bug (position:fixed elements end up placed against a stale
   viewport once the page itself is marked non-scrollable, since Safari
   stops collapsing its own toolbar) — it's what put visible daylight
   under the bottom nav bar on every tab instead of the intended fix.
   #app's own fixed height plus its internal overflow-y:auto already caps
   how tall body ever gets — that alone is enough; body doesn't also need
   to be locked down, and doing so is exactly what broke it. 100dvh
   (dynamic viewport height — accounts for the toolbar directly) is the
   more correct unit for this than 100%/100vh where it's supported; the
   100% above it is the fallback for browsers that aren't. */
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none;
}
#app{
  height:100%;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:calc(var(--safe-top) + 8px) 16px calc(var(--safe-bot) + 84px);max-width:640px;margin:0 auto;
  /* iOS Safari only collapses its own address/toolbar chrome on a real
     user scroll -- there's no way to trigger that early from JS, so the
     nav bar (fixed, bottom:0 -- see below) genuinely does start sitting
     higher than its resting position on first paint, while the toolbar
     is still fully expanded, and only settles once the user scrolls for
     real. What WAS fixable: 100dvh recalculating without a transition
     made that settle read as a hard jump/snap ("sticky") instead of a
     glide. Transitioning height here (and nav's padding-bottom below,
     which grows/shrinks by the same --safe-bot) means both move in the
     same smooth step when the toolbar collapses, instead of teleporting. */
  transition:height .3s ease, padding-bottom .3s ease;
}
/* Set while a sheet is open (see openSheet/closeSheet) so the page behind
   it can't be scrolled at the same time as the sheet's own content. */
#app.locked{overflow:hidden}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:26px 0 10px;font-weight:600}
.sub{color:var(--dim);font-size:14px;margin:0 0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat .n{font-size:24px;font-weight:650;letter-spacing:-.5px;margin-top:2px}
.stat .l{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.muted{color:var(--dim)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{background:var(--accent);color:var(--ink);font-weight:650;border-radius:12px;padding:14px;width:100%;font-size:16px}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:active{opacity:.7}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.quick button{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 12px;text-align:left}
.quick .e{font-size:20px;display:block;margin-bottom:6px}
.quick .t{font-weight:600;font-size:15px;display:block}
.quick .d{font-size:12px;color:var(--dim);display:block;margin-top:2px}
.list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.item:last-child{border-bottom:none}
.item .m{font-weight:550} .item .s{font-size:12px;color:var(--dim);margin-top:2px}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.nudge{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);
  border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav-bg);
  backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-bot);z-index:50;
  transition:padding-bottom .3s ease}
nav button{flex:1;padding:9px 0 7px;font-size:10px;color:var(--dim);display:flex;flex-direction:column;
  align-items:center;gap:3px}
nav button.on{color:var(--accent)}
nav .i{font-size:18px;line-height:1}
/* the center tab (Today) sits raised above the bar in its own accent badge,
   so it reads as the app's anchor point rather than one option among seven */
nav button.center{font-weight:700;color:var(--text)}
nav button.center.on{color:var(--accent)}
nav button.center .badge{width:44px;height:44px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;margin-top:-20px;
  box-shadow:0 4px 14px var(--accent-glow);border:3px solid var(--bg)}
nav button.center .badge .i{font-size:20px;line-height:1;color:var(--ink)}
.sheet{position:fixed;inset:0;background:var(--scrim);z-index:100;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(var(--safe-bot) + 24px);border-top:1px solid var(--line);max-width:640px;margin:0 auto}
.handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 14px}
.confirm{position:fixed;inset:0;background:var(--scrim-strong);z-index:150;display:none;
  align-items:center;justify-content:center;padding:24px}
.confirm.on{display:flex}
.confirm .ccard{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;max-width:340px;width:100%}
.confirm .ccard p{margin:0 0 14px;font-size:15px;text-align:center;color:var(--text)}
.confirm .btn{margin-top:8px}
.confirm .btn:first-of-type{margin-top:0}
label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;
  margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:11px;padding:13px;font:inherit;appearance:none}
input:focus,select,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:88px;resize:vertical}
.big{font-size:30px;font-weight:650;text-align:center;letter-spacing:-1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:14px}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}
.pill{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--panel2);color:var(--dim)}
.pill.bad{background:var(--bad);color:var(--on-bad)}
.status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--good)} .dot.off{background:var(--warn)} .dot.err{background:var(--bad)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-bot) + 76px);background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;z-index:200;opacity:0;
  transform:translateY(12px);transition:.22s;pointer-events:none;font-size:14px;max-width:608px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.empty{color:var(--dim);text-align:center;padding:30px 16px;font-size:14px}
.hide{display:none!important}
.bubble{border-radius:16px;padding:11px 14px;margin-bottom:8px;font-size:15px;max-width:88%;line-height:1.45}
.bubble.me{background:var(--accent);color:var(--ink);margin-left:auto;border-bottom-right-radius:5px}
.bubble.ai{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.tick{width:24px;height:24px;min-width:24px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.sparkrow{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:10px}
.sparkrow>i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
#pull{position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;z-index:40;
  display:flex;align-items:flex-end;justify-content:center;padding-top:var(--safe-top)}
#pull .ring{width:20px;height:20px;margin-bottom:9px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;opacity:0;transition:opacity .15s;transform:rotate(0deg)}
#pull.show .ring{opacity:1}
#pull.ready .ring{border-top-color:var(--good)}
#pull.spin .ring{animation:ptrspin .7s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
#app.pulling{will-change:transform}
/* ---- calendar ---- */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-dow{font-size:10px;color:var(--dim);text-align:center;text-transform:uppercase;padding-bottom:2px}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
  position:relative;font-size:12px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);overflow:hidden}
.cal-cell.pad{visibility:hidden}
.cal-cell.today{border-color:var(--accent);border-width:2px;color:var(--text);font-weight:700}
.cal-cell.h1{background:color-mix(in srgb, var(--accent) 22%, var(--panel2));color:var(--text)}
.cal-cell.h2{background:color-mix(in srgb, var(--accent) 45%, var(--panel2));color:var(--text)}
.cal-cell.h3{background:color-mix(in srgb, var(--accent) 70%, var(--panel2));color:var(--ink)}
.cal-cell.h4{background:var(--accent);color:var(--ink);font-weight:700}
.cal-cell.exempt{opacity:.4}
.cal-week-strip{display:flex;gap:6px;margin-top:8px}
.cal-week-strip .cal-cell{flex:1;aspect-ratio:auto;height:58px;flex-direction:column;gap:3px}
.streak-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:6px;-webkit-overflow-scrolling:touch}
.streak-badge{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:8px 14px;font-size:13px;white-space:nowrap}
.streak-badge b{color:var(--accent)}
/* ---- collapsible sections (settings, chore categories) ---- */
.collapse{margin-bottom:2px}
.collapse-head{display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:4px 2px;margin:26px 0 10px;background:none;text-align:left}
.collapse-head .t{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:600}
.collapse-head .t2{font-size:12px;color:var(--dim);margin-left:8px;text-transform:none;letter-spacing:0;font-weight:400}
.collapse-head .chev{color:var(--dim);font-size:11px;transition:transform .15s;display:inline-block}
.collapse.open>.collapse-head .chev{transform:rotate(90deg)}
.collapse-body{display:none}
.collapse.open>.collapse-body{display:block}
.filter-bar{margin-bottom:14px}
.filter-bar label{margin:10px 0 6px}
.filter-bar label:first-child{margin-top:0}
</style>
</head>
<body>
<div id="pull"><span class="ring"></span></div>
<div id="app"></div>

<nav id="nav">
  <button data-v="calendar"><span class="i">📅</span>Calendar</button>
  <button data-v="life"><span class="i">🎯</span>Life</button>
  <button data-v="money"><span class="i">💵</span>Money</button>
  <button data-v="today" class="center on"><span class="badge"><span class="i">☀️</span></span>Today</button>
  <button data-v="chores"><span class="i">🧹</span>Chores</button>
  <button data-v="fitness"><span class="i">🏃</span>Fitness</button>
  <button data-v="settings"><span class="i">⚙️</span>Settings</button>
</nav>

<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div class="confirm" id="closeConfirm">
  <div class="ccard">
    <p>Save your changes before closing?</p>
    <button class="btn" onclick="saveAndCloseSheet()">Save</button>
    <button class="btn sec" onclick="discardAndCloseSheet()">Discard</button>
    <button class="btn sec" onclick="keepEditingSheet()">Keep editing</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================ config & storage ============================ */

const CFG_KEY = 'lifeos.cfg';
const CACHE_KEY = 'lifeos.summary';
const DEFAULTS = { owner:'', repo:'', branch:'main', token:'', vaultPath:'', vapid:'',
  anthropicKey:'', model:'claude-haiku-4-5-20251001', depth:'gaps',
  guestMode:false };

function cfg(){ try { return {...DEFAULTS, ...JSON.parse(localStorage.getItem(CFG_KEY)||'{}')}; }
              catch(e){ return {...DEFAULTS}; } }
function saveCfg(c){ localStorage.setItem(CFG_KEY, JSON.stringify({...cfg(), ...c})); }
function configured(){ const c = cfg(); return !!(c.owner && c.repo && c.token); }

/* vaultPath lets the vault live in a subfolder of the repo */
function vpath(p){ const v = cfg().vaultPath.replace(/^\/|\/$/g,''); return v ? v + '/' + p : p; }

const CATEGORIES = ['Groceries','Dining','Transport','Housing','Utilities','Health','Fitness',
  'Subscriptions','Shopping','Insurance','Travel','Entertainment','Education','Transfers',
  'Fees & Interest','Savings','Income','Uncategorized'];
const ACTIVITIES = ['Lifting','Run','Walk','Cycle','Swim','Yoga','Climb','Sport','Mobility','Other'];
const INTENSITY = ['easy','moderate','hard','max'];
const CHORE_CATEGORIES = ['home','pets','admin'];
const CHORE_CATEGORY_LABELS = { home:'Home', pets:'Pets', admin:'Admin' };
// One note type, type: chore, covers both a traditional recurring chore
// (due_recur set) and what the app calls a "task" (due_recur blank, "One
// time" below) -- see CLAUDE.md #25. CHORE_FREQS/CHORE_FREQ_LABELS are
// the recurring-only vocabulary (Chores tab filters, FREQ_LABEL); the
// Add/Edit sheet's Repeats picker uses DUE_RECURS/DUE_RECUR_LABELS below,
// which is CHORE_FREQS plus the one-time option.
const CHORE_FREQS = ['daily','weekly','monthly','every_n_days'];
const CHORE_FREQ_LABELS = { daily:'Daily', weekly:'Weekly', monthly:'Monthly', every_n_days:'Every N days' };
const DUE_RECURS = ['', ...CHORE_FREQS];
const DUE_RECUR_LABELS = { '':'One time', ...CHORE_FREQ_LABELS };
const EXEMPTION_KINDS = ['holiday','day_off','event'];
const EXEMPTION_LABELS = { holiday:'Holiday', day_off:'Day off', event:'Event' };

/* ---- due-date notifications: the due date lives directly on the chore it
   belongs to, never a separate note that just references one (see
   CHORE_DRAFT/renderChoreSheet below -- a one-time "task" and a recurring
   chore are the same note type, see CHORE_FREQS above). A notification is
   one of:
     {kind:'offset', minutes, enabled}          -- N minutes before due_time
     {kind:'anchor', anchor:'wake'|'sleep', mode:'piggyback'|'separate', enabled}
   Stored in frontmatter as compact colon-separated tokens inside a bracketed
   list (this vault's frontmatter parsers only understand flat strings and
   string lists, never nested objects) -- mirrored in build_summary.py
   (pass-through only) and 90 System/push/send.js (which actually fires
   them). See 50 Chores/README.md for the token format written out
   in full. */
const ANCHOR_KINDS = ['wake','sleep','work_start','work_end'];

function parseNotificationToken(tok){
  const parts = String(tok).split(':');
  if(parts[0] === 'offset' && parts.length === 4){
    const minutes = parseInt(parts[1], 10);
    return Number.isFinite(minutes) ? {kind:'offset', minutes, enabled: parts[3]==='on'} : null;
  }
  if(parts[0] === 'anchor' && parts.length === 5){
    const [, anchor, offRaw, mode, en] = parts;
    const offsetMin = parseInt(offRaw, 10);
    if(!ANCHOR_KINDS.includes(anchor) || !['piggyback','separate'].includes(mode) || !Number.isFinite(offsetMin)) return null;
    return {kind:'anchor', anchor, offsetMin, mode, enabled: en==='on'};
  }
  return null;
}
function formatNotificationToken(n){
  return n.kind === 'offset'
    ? `offset:${Math.max(30, Math.round((Number(n.minutes)||30)/30)*30)}:-:${n.enabled?'on':'off'}`
    : `anchor:${n.anchor}:${Math.round((Number(n.offsetMin)||0)/30)*30}:${n.mode}:${n.enabled?'on':'off'}`;
}
function parseNotifications(list){
  return (Array.isArray(list) ? list : []).map(parseNotificationToken).filter(Boolean);
}

// Every half hour, "00:00".."23:30" -- the only grid send.js's 30-minute
// poll can ever actually land a push on, so a due-time picker that allowed
// anything finer would just be lying about precision it can't deliver.
const HALF_HOUR_TIMES = (() => {
  const out = [];
  for(let m = 0; m < 1440; m += 30){
    const h24 = Math.floor(m/60), mm = m%60;
    const h12 = ((h24 + 11) % 12) + 1;
    out.push({ value: `${String(h24).padStart(2,'0')}:${String(mm).padStart(2,'0')}`,
               label: `${h12}:${String(mm).padStart(2,'0')} ${h24 < 12 ? 'AM' : 'PM'}` });
  }
  return out;
})();
// setter is a global function name (e.g. 'setChoreDueTime', 'setGoalDueTime')
// -- each draft-holding sheet gets its own, since which draft object it
// mutates differs. Re-renders the whole sheet on change, not just the
// draft, because whether "Before due" is even offered as a notification
// kind depends on a time being set (see NOTIF_EDITOR.allowOffset below),
// so this needs to be a structural change, not a silent draft update like
// the plain text inputs.
function timeSelect(id, value, setter){
  return `<select id="${id}" onchange="${setter}(this.value)">
    <option value="">No specific time</option>` +
    HALF_HOUR_TIMES.map(t => `<option value="${t.value}" ${t.value===value?'selected':''}>${esc(t.label)}</option>`).join('') +
    `</select>`;
}

/* Generic notification-row editor, driven entirely by NOTIF_EDITOR so any
   sheet can embed it: set {list, allowOffset, onChange} then call
   notifRowsHtml() while building that sheet's HTML. onChange re-renders
   the whole sheet from the caller's own draft state (see renderChoreSheet/
   renderGoalEditSheet) -- structural edits (add/remove/kind change) need that;
   the offset-hours text input deliberately skips it (see setNotifOffsetHrs)
   so typing doesn't lose focus on every keystroke. */
let NOTIF_EDITOR = null;
function notifRowsHtml(){
  const e = NOTIF_EDITOR;
  if(!e) return '';
  const rows = e.list.map((n,i) => notifRowHtml(n,i)).join('');
  return `<div class="list">${rows || '<div class="card"><span class="sub">None yet.</span></div>'}</div>
    <button type="button" class="btn sec" style="margin-top:10px" onclick="addNotif()">+ Add a notification</button>`;
}
const ANCHOR_ROW_LABELS = { wake:'Wake-up', sleep:'Sleep', work_start:'Work starts', work_end:'Work ends' };

function notifRowHtml(n, i){
  const e = NOTIF_EDITOR, isOffset = n.kind === 'offset';
  const dir = isOffset ? null : ((n.offsetMin||0) < 0 ? 'before' : (n.offsetMin||0) > 0 ? 'after' : 'at');
  return `<div class="card" style="margin-bottom:8px">
    <div class="row">
      <button type="button" class="tick ${n.enabled?'on':''}" onclick="toggleNotif(${i})" aria-label="enabled">${n.enabled?'✓':''}</button>
      <div class="chips" style="flex:1;margin-left:8px">
        ${e.allowOffset ? `<button type="button" class="chip ${isOffset?'on':''}" onclick="setNotifKind(${i},'offset')">Before due</button>` : ''}
        <button type="button" class="chip ${!isOffset?'on':''}" onclick="setNotifKind(${i},'anchor')">At a time of day</button>
      </div>
      <button type="button" class="btn sec" style="width:auto;padding:6px 10px;margin-left:8px" onclick="removeNotif(${i})">✕</button>
    </div>
    ${isOffset ? `
      <label style="margin-top:8px">Hours before due</label>
      <input type="text" inputmode="decimal" placeholder="e.g. 0.5" value="${n.minutes!=null ? n.minutes/60 : ''}"
        oninput="setNotifOffsetHrs(${i}, this.value)">
      <p class="sub" style="margin-top:4px">Locked to the half hour. Only fires the same day as the due
      time — an offset larger than the time of day doesn't roll back to the day before, it just won't fire.</p>
    ` : `
      <div class="chips" style="margin-top:8px">
        ${ANCHOR_KINDS.map(a => `<button type="button" class="chip ${n.anchor===a?'on':''}"

function addNotif(){
  NOTIF_EDITOR.list.push(NOTIF_EDITOR.allowOffset
    ? {kind:'offset', minutes:30, enabled:true}
    : {kind:'anchor', anchor:'wake', offsetMin:0, mode:'piggyback', enabled:true});
  NOTIF_EDITOR.onChange();
}
function removeNotif(i){ NOTIF_EDITOR.list.splice(i,1); NOTIF_EDITOR.onChange(); }
function toggleNotif(i){ NOTIF_EDITOR.list[i].enabled = !NOTIF_EDITOR.list[i].enabled; NOTIF_EDITOR.onChange(); }
function setNotifKind(i, kind){
  const cur = NOTIF_EDITOR.list[i];
  NOTIF_EDITOR.list[i] = kind === 'offset'
    ? {kind:'offset', minutes: cur.minutes || 30, enabled: cur.enabled}
    : {kind:'anchor', anchor: cur.anchor || 'wake', offsetMin: cur.offsetMin || 0, mode: cur.mode || 'piggyback', enabled: cur.enabled};
  NOTIF_EDITOR.onChange();
}
function setNotifAnchor(i, a){ NOTIF_EDITOR.list[i].anchor = a; NOTIF_EDITOR.onChange(); }
function setNotifMode(i, m){ NOTIF_EDITOR.list[i].mode = m; NOTIF_EDITOR.onChange(); }
// Before/At/After is a signed offsetMin under the hood (negative/positive/
// zero) -- switching direction keeps whatever magnitude was already set
// (defaulting to 30 min) rather than resetting it, so toggling Before/After
// back and forth doesn't lose what the person typed.
function setNotifAnchorDir(i, dir){
  const n = NOTIF_EDITOR.list[i];
  const mag = Math.abs(n.offsetMin || 0) || 30;
  n.offsetMin = dir === 'before' ? -mag : dir === 'after' ? mag : 0;
  NOTIF_EDITOR.onChange();
}
function setNotifAnchorHrs(i, raw){
  const n = NOTIF_EDITOR.list[i];
  const hrs = parseFloat(raw);
  const mag = (isNaN(hrs) || hrs < 0) ? 30 : Math.max(30, Math.round(hrs*2)*30);
  n.offsetMin = (n.offsetMin || 0) < 0 ? -mag : mag;
  // deliberately no onChange() -- re-rendering on every keystroke would drop focus mid-type
}
function setNotifOffsetHrs(i, raw){
  const hrs = parseFloat(raw);
  NOTIF_EDITOR.list[i].minutes = (isNaN(hrs) || hrs < 0) ? 30 : Math.max(30, Math.round(hrs*2)*30);

}

const $ = s => document.querySelector(s);

  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
// Guest mode masks the digits AND strips any +/- sign — a bare minus on a
// masked amount ($-XXX.XX) still tells a bystander "this one's negative",
// which is exactly the cue guest mode exists to hide.
const guestMask = s => cfg().guestMode ? s.replace(/[-+]/g,'').replace(/\d/g,'X') : s;
const money = n => guestMask('$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
const money0 = n => guestMask('$' + Math.round(Number(n)||0).toLocaleString('en-US'));
/* guest mode also strips the color/±-cues that hint whether a masked amount was
   good or bad news — finClass keeps the class only when guest mode is off,
   finSign does the same for a leading +/▲/▼ style marker, pctMask obfuscates
   a comparison percentage the same way money() obfuscates a dollar amount */
const finClass = cls => cfg().guestMode ? '' : cls;
const finSign = (cond, sign='+') => (cond && !cfg().guestMode) ? sign : '';
const pctMask = n => { const s = Math.abs(n).toFixed(0) + '%'; return cfg().guestMode ? s.replace(/\d/g,'X') : s; };
// Same masking guest mode applies globally, but forced on one transaction
// regardless of the guest-mode setting -- an exempt transaction is masked
// "as if individually put into guest mode" even when the device isn't in
// it. Safe to call on an already-masked string too (no digits left to hit).
const forceMask = s => s.replace(/[-+]/g,'').replace(/\d/g,'X');
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const b64 = str => { const b=new TextEncoder().encode(str); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,'')), c=>c.charCodeAt(0)));
const safeName = s => String(s||'').replace(/[\\/:*?"<>|#^\[\]]/g,'').replace(/\s+/g,' ').trim().slice(0,60) || 'Entry';

/* ============================ GitHub API ============================ */

async function gh(endpoint, opts={}){
  const c = cfg();
  if(!configured()) throw new Error('Not configured');
  const res = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${endpoint}`, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + c.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.body ? {'Content-Type':'application/json'} : {}),
      ...(opts.headers||{})
    }
  });
  if(res.status === 404) return null;
  if(!res.ok){
    const body = await res.text().catch(()=> '');
    throw new Error(`GitHub ${res.status}: ${body.slice(0,200)}`);
  }
  return res.status === 204 ? true : res.json();
}

const enc = p => p.split('/').map(encodeURIComponent).join('/');

async function getFile(path){
  const r = await gh(`/contents/${enc(path)}?ref=${encodeURIComponent(cfg().branch)}`);
  return r ? { text: unb64(r.content), sha: r.sha } : null;
}

async function putFile(path, text, message, sha, rawB64){
  const body = { message, content: rawB64 || b64(text), branch: cfg().branch };
  if(sha) body.sha = sha;
  return gh(`/contents/${enc(path)}`, { method:'PUT', body: JSON.stringify(body) });
}

/* Real delete, not a soft-remove like chores' active:false — an exemption
   carries no history worth keeping. Online-only on purpose: the offline
   queue (see write() below) is built for creates/updates, where a stale sha
   just means "fetch it again"; queuing a delete against a sha that goes
   stale while offline is a different, easier-to-get-wrong failure mode, so
   this asks for a connection instead of pretending to queue safely. */
async function deleteFile(path, sha, message){
  return gh(`/contents/${enc(path)}`, { method:'DELETE', body: JSON.stringify({ message, sha, branch: cfg().branch }) });
}

/* ============================ offline queue (IndexedDB) ============================ */

let dbp;
function db(){
  if(dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open('lifeos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('ops', { keyPath:'id', autoIncrement:true });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('ops', mode), s = t.objectStore('ops');
    const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  });
}
const queueAdd  = op => tx('readwrite', s => s.add(op));
const queueAll  = () => tx('readonly',  s => s.getAll());
const queueDel  = id => tx('readwrite', s => s.delete(id));

/* Every write goes through here: try now, queue if it fails. */
async function write(path, text, message, opts={}){
  if(!navigator.onLine){ await queueAdd({path, text, message, mode:opts.mode||'create'}); return 'queued'; }
  try {
    if(opts.mode === 'update'){
      const cur = await getFile(path);
      await putFile(path, text, message, cur ? cur.sha : undefined);
    } else {
      let p = path, n = 2;
      while(await getFile(p)){ p = path.replace(/\.md$/, ` (${n}).md`); n++; if(n>20) break; }
      await putFile(p, text, message);
    }
    return 'saved';
  } catch(e){
    await queueAdd({path, text, message, mode:opts.mode||'create'});
    console.warn('queued after error', e);
    return 'queued';
  }
}

/* getFile(), but checks the local write queue first for a not-yet-synced
   write to this exact path -- without this, patching something you just
   created (or just edited) before ITS OWN write has actually reached
   GitHub -- whether because you're offline, or because that earlier write
   happened to queue after a transient failure (see write()'s catch-and-
   queue fallback above) -- fails with a "missing" error that has nothing
   to do with what's actually wrong: the note exists, just not on GitHub
   yet. This is exactly what made a brand-new task "struggle" to be marked
   complete -- tap the tick fast enough after adding it and setTaskNoteDone
   (below) would getFile() a path that's still sitting in the queue,
   unrelated to whether the note itself was ever wrong. Picks the LAST
   queued op for this path (there could be a create followed by an earlier
   edit, both still unflushed) since that's the freshest state to build on.
   Plain writes only (!op.kind) -- mergeWrite's queued shape carries fields
   to re-resolve, not a ready body, and nothing chore/task-related ever
   goes through mergeWrite anyway. */
async function getFilePending(path){
  const mine = (await queueAll()).filter(op => op.path === path && !op.kind && typeof op.text === 'string');
  if(mine.length) return { text: mine[mine.length - 1].text, pendingIds: mine.map(op => op.id) };
  const cur = await getFile(path);
  return cur ? { text: cur.text, pendingIds: null } : null;
}

/* Read-patch-write built on getFilePending() above -- use this instead of
   a bare getFile()-then-write() anywhere the note being patched might only
   exist as a queued write so far (a chore/task note, right after saveChore()
   -- see setTaskNoteDone()/updateChore()). When the current text came from
   the queue, every one of those queued ops for this path is deleted before
   the new write goes out, so this cleanly replaces the whole chain instead
   of adding one more link that flushQueue() would later apply on top and
   conflict with (a queued 'update' with no sha, once an earlier queued
   'create' for the same path has already landed for real, is a write
   GitHub will reject -- same class of problem mergeWrite's own comment
   above describes for a daily note, just for a full-text patch here
   instead of a merge function). */
async function writePending(path, patchFn, message){
  const cur = await getFilePending(path);
  if(!cur) throw new Error('Note missing');
  if(cur.pendingIds) for(const id of cur.pendingIds) await queueDel(id);
  return write(path, patchFn(cur.text), message, { mode:'update' });
}

/* Read-modify-write ops that patch a daily note (check-in, add-a-task)
   go through here instead of write(). They queue {kind, fields} -- the
   raw inputs -- rather than a pre-resolved file body, and re-run the
   merge against whatever the file actually contains at the moment the
   write reaches GitHub, whether that's right now or after flushQueue()
   picks it up later. Resolving the merge once, up front, and queuing the
   result as a fixed blob (the old approach, and still what write() does
   for straightforward creates) is exactly wrong here: it either bakes in
   a blank DAILY_TEMPLATE in place of the day's real content whenever the
   read that built it failed for any reason (a dropped connection, not
   just "the file doesn't exist yet"), or -- once queued -- clobbers
   whatever anyone else wrote to that same file before this entry
   eventually flushes. Both silently erase mood/journal/wins/open-loops
   that were already saved. See MERGE_FNS below for the two kinds. */
async function mergeWrite(path, kind, fields, message){
  if(!navigator.onLine){ await queueAdd({path, message, kind, fields}); return 'queued'; }
  try {
    const cur = await getFile(path);
    const md = MERGE_FNS[kind](cur ? cur.text : DAILY_TEMPLATE(dateFromDailyPath(path)), fields);
    await putFile(path, md, message, cur ? cur.sha : undefined);
    return 'saved';
  } catch(e){
    await queueAdd({path, message, kind, fields});
    console.warn('queued after error', e);
    return 'queued';
  }
}

async function flushQueue(){
  if(!navigator.onLine || !configured()) return 0;
  const ops = await queueAll(); let n = 0;
  for(const op of ops){
    try {
      if(op.kind){
        const cur = await getFile(op.path);
        const md = MERGE_FNS[op.kind](cur ? cur.text : DAILY_TEMPLATE(dateFromDailyPath(op.path)), op.fields);
        await putFile(op.path, md, op.message, cur ? cur.sha : undefined);
      } else if(op.mode === 'update'){
        const cur = await getFile(op.path);
        await putFile(op.path, op.text, op.message, cur ? cur.sha : undefined);
      } else {
        await putFile(op.path, op.text, op.message);
      }
      await queueDel(op.id); n++;
    } catch(e){ console.warn('flush failed', e); break; }
  }
  return n;
}

/* ============================ markdown builders ============================ */

function fm(obj){
  const lines = Object.entries(obj).map(([k,v]) => {
    if(v === null || v === undefined || v === '') return `${k}: `;
    if(Array.isArray(v)) return `${k}: [${v.join(', ')}]`;
    const s = String(v);
    return /[:#\[\]{}&*!|>'"%@`]/.test(s) ? `${k}: "${s.replace(/"/g,'\\"')}"` : `${k}: ${s}`;
  });
  return '---\n' + lines.join('\n') + '\n---\n';
}

function transactionNote(t){
  const body = fm({
    type:'transaction', date:t.date, amount:Number(t.amount).toFixed(2), direction:t.direction,
    merchant:t.merchant, category:t.category, account:t.account, method:t.method||'',
    source:'phone', external_id:`phone:${t.date}:${t.merchant}:${t.amount}`, tags:['finance','transaction']
  });
  const verb = t.direction === 'expense' ? 'spent' : 'received';
  return body + `
# ${t.merchant} — ${money(t.amount)}

On **${t.date}** you ${verb} **${money(t.amount)}** at **${t.merchant}**.

- Category: ${t.category}
- Account: [[20 Finance/Accounts/${t.account}|${t.account}]]
- Day: [[10 Daily/${t.date}|${t.date}]]

## Notes

${t.note || ''}
`;
}

function workoutNote(w){

    intensity:w.intensity, distance_mi:w.distance_mi||'', calories:'', avg_hr:'',
    soreness:'', tags:['fitness','workout']
  });
  return body + `
# ${w.activity} — ${w.duration_min} min

**Activity:** ${w.activity}
**Duration:** ${w.duration_min} minutes
**Intensity:** ${w.intensity}
**Day:** [[10 Daily/${w.date}|${w.date}]]

## How it felt

${w.note || ''}
`;
}

function metricNote(m){
  const body = fm({
    type:'metric', date:m.date, weight_lbs:m.weight_lbs||'', body_fat_pct:m.body_fat_pct||'',
    resting_hr:m.resting_hr||'', waist_in:m.waist_in||'', sleep_hours:'', tags:['fitness','metric']
  });
  return body + `\n# Body metrics — ${m.date}\n\nLogged from phone.\n`;

const DAILY_TEMPLATE = d => fm({
  type:'daily', date:d, mood:'', energy:'', sleep_hours:'', weight_lbs:'', day_rating:'', tags:['daily']
}) + `
# ${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}

## Morning check-in

**What matters most today:**
- 

## Journal

## Wins

## Open loops

## Evening review

**Rating out of 10:** 
`;

/* Set a frontmatter key in an existing markdown string. */
function setFm(md, key, val){
  if(val === '' || val === undefined || val === null) return md;
  if(!md.startsWith('---')) return md;
  const end = md.indexOf('\n---', 3);
  if(end < 0) return md;
  let head = md.slice(0, end), rest = md.slice(end);
  const re = new RegExp('^' + key + ':.*$', 'm');
  head = re.test(head) ? head.replace(re, `${key}: ${val}`) : head + `\n${key}: ${val}`;
  return head + rest;
}

/* Append text under a "## Heading" section, creating the heading if absent. */
function appendSection(md, heading, text){
  if(!text) return md;
  const re = new RegExp('^## ' + heading.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*$', 'm');
  const m = md.match(re);
  if(!m) return md.trimEnd() + `\n\n## ${heading}\n\n${text}\n`;
  const start = m.index + m[0].length;
  const nextIdx = md.slice(start).search(/^## /m);
  const insertAt = nextIdx === -1 ? md.length : start + nextIdx;
  /* drop the template's empty placeholder bullets so the section reads clean */
  const before = md.slice(0, insertAt).replace(/\n[-*][ \t]*(\[[ xX]\][ \t]*)?(?=\n*$)/g, '').trimEnd();
  return before + `\n\n${text}\n\n` + md.slice(insertAt);
}

/* Read a frontmatter key back out — the read-side counterpart to setFm.
   Used to pre-fill an edit sheet with a note's current values before an
   overwrite-style save (e.g. workoutNote()) would otherwise blank them. */
function getFm(md, key){
  if(!md.startsWith('---')) return '';
  const end = md.indexOf('\n---', 3);
  const head = end < 0 ? md : md.slice(0, end);
  const m = new RegExp('^' + key + ':\\s*(.*)$', 'm').exec(head);
  if(!m) return '';
  let v = m[1].trim();
  if(v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1).replace(/\\"/g, '"');
  return v;
}

/* Read a "## Heading" section's body back out — the read-side counterpart
   to appendSection. */
function readSection(md, heading){
  const re = new RegExp('^## ' + heading.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*$', 'm');
  const m = md.match(re);
  if(!m) return '';
  const start = m.index + m[0].length;
  const nextIdx = md.slice(start).search(/^## /m);
  const end = nextIdx === -1 ? md.length : start + nextIdx;
  return md.slice(start, end).replace(/^[-*][ \t]*(\[[ xX]\][ \t]*)?/gm, '').trim();
}

async function saveExpense(f){
  const path = vpath(`20 Finance/Transactions/${f.date} ${safeName(f.merchant)} ${Number(f.amount).toFixed(2)}.md`);
  const r = await write(path, transactionNote(f), `Log ${f.direction}: ${f.merchant} ${money(f.amount)}`);
  bump(d => {
    if(f.direction !== 'expense') return;
    d.money.spent_today = +(d.money.spent_today + Number(f.amount)).toFixed(2);
    d.money.spent_month = +(d.money.spent_month + Number(f.amount)).toFixed(2);
    d.money.recent.unshift({date:f.date, amount:Number(f.amount), direction:f.direction,
      merchant:f.merchant, category:f.category, account:f.account, path});
  });
  return r;
}

async function saveWorkout(f){
  const path = vpath(`30 Fitness/Workouts/${f.date} ${safeName(f.activity)}.md`);
  const r = await write(path, workoutNote(f), `Log workout: ${f.activity} ${f.duration_min}min`);
  bump(d => {
    d.fitness.sessions_7d++; d.fitness.minutes_7d += Number(f.duration_min)||0;
    d.fitness.recent.unshift({date:f.date, activity:f.activity,
      duration_min:Number(f.duration_min)||0, intensity:f.intensity, path});
  });
  return r;
}

async function saveMetrics(f){
  const path = vpath(`30 Fitness/Metrics/${f.date}.md`);
  const r = await write(path, metricNote(f), `Body metrics ${f.date}`, {mode:'update'});
  bump(d => { if(f.weight_lbs) d.fitness.latest_weight = Number(f.weight_lbs); });
  return r;
}

/* Extracted so it can run twice: once against whatever saveCheckin/addTask
   read just now, and again inside flushQueue() against whatever the file
   holds by the time a queued entry actually reaches GitHub. Never bakes
   its result into the queue itself -- see mergeWrite(). */
function mergeCheckinInto(md, f){
  ['mood','energy','sleep_hours','weight_lbs','day_rating'].forEach(k => { md = setFm(md, k, f[k]); });
  if(f.focus)   md = appendSection(md, 'Morning check-in', `**Focus:** ${f.focus}`);
  if(f.journal) md = appendSection(md, 'Journal', f.journal);
  if(f.win)     md = appendSection(md, 'Wins', `- ${f.win}`);
  return md;
}
const MERGE_FNS = { checkin: mergeCheckinInto };
const dateFromDailyPath = path => (path.match(/(\d{4}-\d{2}-\d{2})\.md$/) || [,todayISO()])[1];

async function saveCheckin(f){
  const path = vpath(`10 Daily/${f.date}.md`);
  return mergeWrite(path, 'checkin', f, `Check-in ${f.date}`);
}

async function saveGoalProgress(f){
  const cur = await getFile(f.path);
  if(!cur) throw new Error('Goal note not found');
  let md = setFm(cur.text, 'current_value', f.value);
  const row = `| ${f.date} | ${f.value} | ${f.note || ''} |`;
  md = md.replace(/(\| Date \| Value \| Note \|\n\|---\|---\|---\|\n)/, `$1${row}\n`);
  if(!md.includes(row)) md = appendSection(md, 'Progress log', row);
  return write(f.path, md, `Goal progress: ${f.name} → ${f.value}`, {mode:'update'});
}

/* optimistic local update so the UI reacts before CI regenerates summary.json */
function bump(fn){
  if(!DATA) return;
  try { fn(DATA); localStorage.setItem(CACHE_KEY, JSON.stringify(DATA)); } catch(e){}
}

  'claude-sonnet-4-6':         { in:3.00, out:15.00, cacheW:3.75, cacheR:0.30, label:'Sonnet 4.6' }
};

const SYSTEM_PROMPT = `You turn a spoken daily update into structured operations for a personal
markdown vault covering money, fitness, and life goals. The person dictates freely and out of order.
Your job is to extract what actually happened, ask about what is missing, and never invent a number.

Reply with a single JSON object and nothing else:

{
  "reply": "one or two sentences, warm and brief, no bullet points",
  "operations": [ ... ],
  "questions": [ "short question", ... ],
  "done": false
}

Operation shapes. Every operation also carries a "summary" string of at most 10 words that will be
shown to the person for approval.

{"type":"expense","summary":"","amount":18.4,"merchant":"Joe's Coffee","category":"Dining","account":"Amex","date":"YYYY-MM-DD","note":""}
{"type":"income","summary":"","amount":2140.55,"merchant":"Payroll","category":"Income","account":"Credit Union Checking","date":"YYYY-MM-DD","note":""}
{"type":"workout","summary":"","activity":"Cycle","duration_min":48,"intensity":"easy|moderate|hard|max","distance_mi":null,"date":"YYYY-MM-DD","note":""}
{"type":"metric","summary":"","date":"YYYY-MM-DD","weight_lbs":null,"body_fat_pct":null,"resting_hr":null,"waist_in":null}
{"type":"checkin","summary":"","date":"YYYY-MM-DD","mood":null,"energy":null,"sleep_hours":null,"day_rating":null,"focus":"","journal":"","win":""}
  (mood, energy, and day_rating are each a whole number 1-10, or null — same scale as the app's own
  check-in sheet. "Low energy" with no number given is a null, described in "journal" instead; do
  not invent a 1-10 value for it, and never write a word like "low" or "great" into these fields.)
{"type":"goal_progress","summary":"","goal_id":0,"value":400,"note":""}
{"type":"task_done","summary":"","task_id":3}
{"type":"task_add","summary":"","text":"Call the credit union","date":"YYYY-MM-DD","due_date":null,"due_recur":null,"due_day":null,"due_weekday":null,"due_time":null}
  (due_date/due_recur/due_day/due_weekday/due_time are only for a task that
  genuinely has a due date -- leave all five null for a plain quick task, which
  is the common case. Set due_date (YYYY-MM-DD) for a one-time due date, or
  due_recur to "daily", "weekly" (with due_weekday, 0=Sunday..6=Saturday), or
  "monthly" (with due_day, 1-31) for something recurring like "every day",
  "every Tuesday", or "the 15th of every month" -- set only the one field that
  recurrence needs, never due_date alongside a due_recur. due_time, if the
  person gives one, must round to the nearest half hour -- "around 2" becomes
  "14:00", "quarter past 9" becomes "09:00" or "09:30", whichever is closer --
  because that is the only grid a push can ever actually fire on. Never invent
  a due date that wasn't said.)
{"type":"achievement","summary":"","title":"First 10k run","domain":"fitness|finance|life","date":"YYYY-MM-DD","note":""}
{"type":"chore_done","summary":"","chore":"Feed cats","times":1,"date":"YYYY-MM-DD","note":""}
{"type":"chore_add","summary":"","name":"Water the plants","category":"home|pets|admin","due_recur":"daily|weekly|monthly|every_n_days","times_per_period":1,"due_every_days":null,"area":"","pet":""}
{"type":"exemption","summary":"","kind":"holiday|day_off|event","start_date":"YYYY-MM-DD","end_date":"YYYY-MM-DD","note":""}

Rules that matter:

- Never guess an amount, a duration, or which account a charge went on. If it is unclear, leave the
  operation out and ask about it instead. A wrong number in someone's financial record is worse than
  an extra question.
- Use only category and account names from the context. If nothing fits, use "Uncategorized".
- Resolve relative dates ("yesterday", "Friday") against today's date in the context.
- Anything reflective, emotional, or narrative belongs in the checkin operation's "journal" field.
  Do not turn a feeling into a task.
- Put a genuine accomplishment in "win" on the checkin. Reserve the achievement operation for
  milestones worth their own note.
- Only reference goal_id and task_id values that appear in the context.
- For chore_done, "chore" must match a chore name from the context exactly. If the
  person clearly did something that is not on the list, use chore_add instead of
  inventing a completion against a name that does not exist.
- "Fed the cats twice" is one chore_done with times: 2, not two operations.
- Pet care is worth confirming when it goes unmentioned for a day. Feeding, water,
  and litter are the ones to ask about — not the vacuuming.
- For exemption, end_date defaults to start_date for a single day ("mark tomorrow
  as a day off"). It covers every chore and every reminder for that range — there's
  no way to scope it to specific ones from here; if the person wants that, tell them
  to narrow it from the Calendar tab instead of guessing which ones they meant.
- One checkin operation per day at most; merge everything reflective into it.
- If a new task sounds like it genuinely has a deadline -- a bill, a renewal, a
  form due back, an appointment -- but the person didn't say when, ask about it
  in questions instead of leaving it a plain task or guessing a date. Don't ask
  this for an ordinary loose end with no natural deadline ("call mom back",
  "look into a new backpack") -- only when the thing itself implies one.
- Set "done" to true when you have nothing further worth asking.
- Questions must be answerable in a sentence. Never ask more than three at once.`;

function buildContext(){
  const d = DATA || {};
  const life = d.life || {}, money = d.money || {}, fit = d.fitness || {};
  const goals = (life.goals || []).filter(g => g.status === 'active')
    .map((g, i) => ({ id:i, name:g.name, domain:g.domain, metric:g.metric,
                      current:g.current, target:g.target, unit:g.unit }));
  window.__goalIndex = (life.goals || []).filter(g => g.status === 'active');
  const tasks = ((d.chores && d.chores.tasks) || []).slice(0, 25).map(t => ({ id:t.id, text:t.text }));
  const chores = ((d.chores && d.chores.due) || []).slice(0, 20);
  const allChores = ((d.chores && d.chores.all) || []).map(c => c.name);
  const today = todayISO();
  const soon = (d.exemptions || []).filter(e => e.end_date >= today).slice(0, 8);
  const depth = cfg().depth || 'gaps';
  const depthLine = {
    minimal: 'Ask only when the update is genuinely ambiguous. Do not raise anything the person did not mention.',
    gaps:    'After parsing, ask about at most two or three things the person did not mention that look like gaps: a goal with no recent movement, an old open task, an uncategorized charge. Then set done.',
    full:    'Work through the open goals and tasks over several turns until each has a current status. Two or three questions per turn, never more. Set done only when everything below has been addressed or explicitly skipped.'
  }[depth];

  return `Today is ${today}.

Follow-up depth: ${depthLine}

Accounts: ${(money.accounts || []).map(a => a.name).join(', ') || 'none yet'}
Categories: ${CATEGORIES.join(', ')}
Activities commonly logged: ${ACTIVITIES.join(', ')}

Active goals:
${goals.length ? goals.map(g => `  [${g.id}] ${g.name} (${g.domain}) — ${g.metric || 'no metric'}: ${g.current} of ${g.target} ${g.unit || ''}`).join('\n') : '  none'}

Open tasks (chores that haven't been set to recur):
${tasks.length ? tasks.map(t => `  [${t.id}] ${t.text}`).join('\n') : '  none'}

Chores due (use these names exactly):
${chores.length ? chores.map(c => `  ${c.name} (${c.category}, ${c.due_recur === 'every_n_days' ? `every ${c.due_every_days} days` : c.due_recur}` +
    (c.times_per_period > 1 ? `, ${c.done_this_period || 0} of ${c.times_per_period} done today` : '') +
    (c.overdue_days > 0 ? `, ${c.overdue_days} days overdue` : '') + ')').join('\n') : '  none outstanding'}
All chore names: ${allChores.join(', ') || 'none defined'}

Exemptions covering today or soon (chores/reminders already off for these days —
don't suggest adding one that overlaps):
${soon.length ? soon.map(e => `  ${e.kind}: ${e.start_date}${e.end_date !== e.start_date ? ' to ' + e.end_date : ''}${e.note ? ' — ' + e.note : ''}`).join('\n') : '  none'}

Recent context: spent ${money.spent_month || 0} this month, ${fit.sessions_7d || 0} workouts in the
last 7 days, latest weight ${fit.latest_weight || 'unknown'}.
Flags: ${(d.nudges || []).map(n => n.text).join('; ') || 'none'}`;
}

let CHAT = [];
let PENDING = [];
let THINKING = false;

function spend(){ try { return JSON.parse(localStorage.getItem('lifeos.spend') || '{"usd":0,"turns":0}'); }
                  catch(e){ return {usd:0, turns:0}; } }
function addSpend(usage, model){
  const p = PRICES[model] || PRICES['claude-haiku-4-5-20251001'];
  const u = usage || {};
  const cost = ((u.input_tokens || 0) * p.in
              + (u.output_tokens || 0) * p.out
              + (u.cache_creation_input_tokens || 0) * p.cacheW
              + (u.cache_read_input_tokens || 0) * p.cacheR) / 1e6;
  const s = spend();
  localStorage.setItem('lifeos.spend', JSON.stringify({ usd: s.usd + cost, turns: s.turns + 1 }));
  return cost;
}

async function askClaude(userText){
  const c = cfg();
  if(!c.anthropicKey) throw new Error('Add your Claude API key in Settings');
  const model = c.model || 'claude-haiku-4-5-20251001';
  CHAT.push({ role:'user', content: userText });

  const body = {
    model,
    max_tokens: 1600,
    system: [
      { type:'text', text: SYSTEM_PROMPT, cache_control:{ type:'ephemeral' } },
      { type:'text', text: buildContext(), cache_control:{ type:'ephemeral' } }
    ],
    messages: [...CHAT, { role:'assistant', content:'{' }]
  };

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers: {
      'content-type':'application/json',
      'x-api-key': c.anthropicKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Claude ${res.status}: ${t.slice(0,160)}`);
  }
  const json = await res.json();
  const raw = '{' + (json.content || []).map(b => b.text || '').join('');
  addSpend(json.usage, model);

  let parsed;
  try { parsed = JSON.parse(raw); }
  catch(e){
    const m = raw.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('Could not read the response');
    parsed = JSON.parse(m[0]);
  }
  CHAT.push({ role:'assistant', content: raw });
  return parsed;
}

/* ---- executing approved operations ---- */

/* Defense in depth against the model writing something outside the 1-10
   contract the rest of the app assumes for mood/energy/day_rating -- the
   check-in edit sheets are literally chip pickers over '1'..'10'. Clamp
   here rather than trust the prompt alone; a stray "low" or a 0-100 scale
   should become a blank field, not silently-wrong data in the vault. */
function scale10(v){
  if(v === null || v === undefined || v === '') return '';
  const n = Math.round(Number(v));
  return Number.isFinite(n) && n >= 1 && n <= 10 ? n : '';
}

/* Same defense-in-depth idea for a dictated due_time -- the prompt asks the
   model to round to the half hour, but that's the only grid send.js's poll
   can ever land a push on, so clamp here too rather than trust it alone.
   An unparseable value becomes blank (no time) rather than a guess. */
function roundHalfHour(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
  if(!m) return '';
  const mins = ((parseInt(m[1],10)||0)*60 + (parseInt(m[2],10)||0) + 15) / 30 | 0;
  const snapped = (mins * 30) % 1440;
  return `${String(Math.floor(snapped/60)).padStart(2,'0')}:${String(snapped%60).padStart(2,'0')}`;
}

async function runOp(op){
  const date = op.date || todayISO();
  switch(op.type){
    case 'expense':
    case 'income':
      return saveExpense({ amount: Number(op.amount), merchant: op.merchant || 'Unknown',
        category: op.category || 'Uncategorized', account: op.account || '',
        direction: op.type === 'income' ? 'income' : 'expense', date, note: op.note || '' });
    case 'workout':
      return saveWorkout({ activity: op.activity || 'Workout', duration_min: Number(op.duration_min) || 0,
        intensity: op.intensity || 'moderate', distance_mi: op.distance_mi || '', date, note: op.note || '' });
    case 'metric':
      return saveMetrics({ date, weight_lbs: op.weight_lbs || '', body_fat_pct: op.body_fat_pct || '',
        resting_hr: op.resting_hr || '', waist_in: op.waist_in || '' });
    case 'checkin':
      return saveCheckin({ date, mood: scale10(op.mood), energy: scale10(op.energy),
        sleep_hours: op.sleep_hours ?? '', day_rating: scale10(op.day_rating),
        focus: op.focus || '', journal: op.journal || '', win: op.win || '' });
    case 'goal_progress': {
      const g = (window.__goalIndex || [])[op.goal_id];
      if(!g) throw new Error('Unknown goal');
      return saveGoalProgress({ path:g.path, name:g.name, value:op.value, date, note: op.note || '' });
    }
    case 'task_done':  return completeTask(op.task_id);
    case 'task_add': {
      // Every task is a chore note now, due date or not (CLAUDE.md #25) --
      // there's no separate lightweight checklist mechanism to fall back
      // to. due_recur is one of daily/weekly/monthly here (the dictation
      // prompt never offers every_n_days for a plain task_add).
      const recur = ['daily','weekly','monthly'].includes(op.due_recur) ? op.due_recur : '';
      return saveChore({ name: op.text, due_date: op.due_date || '', due_recur: recur,
        due_day: op.due_day != null ? op.due_day : '',
        due_weekday: op.due_weekday != null ? op.due_weekday : '',
        due_time: roundHalfHour(op.due_time), notifications: [] });
    }
    case 'achievement':return saveAchievement({ title:op.title, domain:op.domain || 'life', date, note:op.note || '' });
    case 'chore_done': {
      const times = Math.max(1, Math.min(6, Number(op.times) || 1));
      let last;
      for(let i = 0; i < times; i++) last = await logChore(op.chore, op.note || '');
      return last;
    }
    case 'chore_add':  return saveChore(op);
    case 'exemption':
      return saveExemption({ kind: op.kind || 'event', start_date: op.start_date || date,
        end_date: op.end_date || op.start_date || date, note: op.note || '', chores: [], notifications: [] });
    default: throw new Error('Unknown operation: ' + op.type);
  }
}

/* A task is a chore that hasn't been set to recur (CLAUDE.md #25) -- its
   own file with done/done_date frontmatter flags, no separate lightweight
   checklist mechanism anymore. Setting those two fields is the whole
   completion operation. Completion isn't permanent (see toggleTask/
   CLAUDE.md #21): done_date drives sorting in the Completed section, and
   going back to false leaves a stale done_date on the note rather than
   clearing it (setFm() is a no-op on '', same tolerated staleness as every
   other recur-conditional field here) -- harmless, since build_summary.py
   only reads done_date for notes where done is still true. */
async function setTaskNoteDone(t, done){
  return writePending(vpath(t.path), md => {
    let out = setFm(md, 'done', done);
    if(done) out = setFm(out, 'done_date', todayISO());
    return out;
  }, `${done ? 'Done' : 'Reopen'}: ${t.text.slice(0,50)}`);
}

// Looks a task up by id, open OR done -- ids are unique across both lists
// (build_summary.py numbers chores.tasks_done starting where chores.tasks
// left off), since completion is a toggle, not a permanent move off a
// list the app can forget about (CLAUDE.md #21).
function findTaskById(id){
  return ((DATA && DATA.chores && DATA.chores.tasks) || []).find(x => x.id === id)
    || ((DATA && DATA.chores && DATA.chores.tasks_done) || []).find(x => x.id === id);
}

async function completeTask(id){
  const t = findTaskById(id);
  if(!t) throw new Error('Task not found');
  return setTaskNoteDone(t, true);
}

async function uncompleteTask(id){
  const t = findTaskById(id);
  if(!t) throw new Error('Task not found');
  return setTaskNoteDone(t, false);
}

/* Client-side mirror of build_summary.py's due_occurrence(), today-only --
   lets a just-added/edited task show the right due_today/next_date
   immediately, without waiting on a real summary rebuild (see
   bumpChoreDraft()). Never computes overdue-days or streaks; those stay
   genuinely unknown here (a recurring chore's, from the log; a task just
   reads next_date < today, see taskRow()) until the real thing runs. */
function localDueOccurrence(rec, todayIso){
  const t = todayIso || todayISO();
  if(rec.due_recur === 'daily') return { due_today:true, next_date:t };
  if(rec.due_recur === 'weekly'){
    const wd = (rec.due_weekday === '' || rec.due_weekday == null) ? null : Number(rec.due_weekday);
    if(wd == null || wd < 0 || wd > 6) return { due_today:false, next_date:'' };
    const d = new Date(t + 'T00:00:00');
    const delta = (wd - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + delta);
    const iso = d.toISOString().slice(0,10);
    return { due_today: iso === t, next_date: iso };
  }
  if(rec.due_recur === 'monthly'){
    const day = (rec.due_day === '' || rec.due_day == null) ? null : Number(rec.due_day);
    if(!day || day < 1 || day > 31) return { due_today:false, next_date:'' };
    const [y, m] = t.split('-').map(Number);
    const clamp = (yr, mo) => Math.min(day, new Date(yr, mo, 0).getDate());
    let iso = `${y}-${String(m).padStart(2,'0')}-${String(clamp(y,m)).padStart(2,'0')}`;
    if(iso < t){
      const ny = m < 12 ? y : y+1, nm = m < 12 ? m+1 : 1;
      iso = `${ny}-${String(nm).padStart(2,'0')}-${String(clamp(ny,nm)).padStart(2,'0')}`;
    }
    return { due_today: iso === t, next_date: iso };
  }
  if(rec.due_date) return { due_today: rec.due_date === t, next_date: rec.due_date };
  return { due_today:false, next_date:'' };
}

/* A task's due line: "Monthly, day 15" or "2026-08-12", plus a time if
   one's set. Blank for a task with no due_date at all -- an open item
   with nothing to be "due." */
function taskDueLine(t){
  const when = t.due_recur === 'daily' ? 'Daily'
    : t.due_recur === 'weekly' ? `Weekly, ${WEEKDAY_LABELS[String(t.due_weekday)] || '?'}`
    : t.due_recur === 'monthly' ? `Monthly, day ${t.due_day}`
    : (t.next_date || t.due_date);
  return [when, t.due_time].filter(Boolean).join(' · ');
}

function taskRow(t, opts={}){
  const done = !!t.done, sub = taskDueLine(t);
  // A task has no overdue_days the way a recurring chore does (see
  // CLAUDE.md #25) -- once its next_date is in the past and it's still
  // open, that's the only signal there is, so it's worth calling out the
  // same way an overdue chore gets a red badge instead of quietly fading
  // out of the "today" pill.
  const overdue = !done && t.next_date && t.next_date < todayISO();
  const body = `<div class="m" style="min-width:0;${done?'text-decoration:line-through;color:var(--dim)':''}">${esc(t.text)}</div>${
    sub ? `<div class="s ${overdue?'bad':''}">${esc(sub)}</div>` : ''}`;
  return `<div class="item">
    <div style="display:flex;gap:11px;align-items:center;flex:1;min-width:0">
      <button class="tick ${done?'on':''}" onclick="toggleTask(${t.id}, this)"
        aria-label="${done?'mark not done':'mark done'}">${done?'✓':''}</button>
      <button style="min-width:0;flex:1;text-align:left;background:none;border:none;padding:0" onclick="sheetEditDueChore(${t.id})">${body}</button>
      ${t.due_today && !opts.hidePill ? '<span class="pill">today</span>' : ''}
      ${overdue && !opts.hidePill ? '<span class="pill bad">late</span>' : ''}
    </div>
  </div>`;
}

// Completion isn't permanent (CLAUDE.md #21) -- a done item moves from
// chores.tasks into chores.tasks_done (or back) locally, rather than just
// flipping .done in place, so the Completed section reflects the tick
// immediately instead of waiting for the next real summary rebuild.
async function toggleTask(id, btn){
  const t = findTaskById(id);
  if(!t) return toast('Task not found');
  btn.disabled = true;
  try {
    const goingDone = !t.done;
    const r = goingDone ? await completeTask(id) : await uncompleteTask(id);
    bump(d => {
      d.chores.tasks = d.chores.tasks || [];
      d.chores.tasks_done = d.chores.tasks_done || [];
      const from = goingDone ? d.chores.tasks : d.chores.tasks_done;
      const to = goingDone ? d.chores.tasks_done : d.chores.tasks;
      const idx = from.findIndex(x => x.id === id);
      if(idx < 0) return;
      const [x] = from.splice(idx, 1);
      x.done = goingDone;
      x.done_date = goingDone ? todayISO() : '';
      to.unshift(x);
    });
    render();
    toast(r === 'queued' ? 'Saved on device' : (goingDone ? 'Marked done' : 'Marked not done'));
  } catch(e){
    toast('Failed: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

/* Reflects an add/edit/conversion locally so the Chores tab shows the
   right thing immediately -- otherwise nothing on screen changes until a
   real summary rebuild lands, which needs a GitHub Action to actually run
   and can take minutes, unlike every other sheet in this file (compare
   submitExpense/submitEditGoal/etc, which all bump()). due/overdue_days/
   streak/last_done for a RECURRING chore stay whatever they already were
   (blank for a new one) since only update_chores.py's log can really
   compute those; a task's due_today/next_date are recomputed with
   localDueOccurrence() so its "today"/"late" pill is right immediately.
   d is a draft-shaped object (CHORE_DRAFT) -- d.path set means this is an
   edit, and since editing can convert a chore between recurring and
   one-time, the existing record is pulled from whichever of the three
   arrays it's actually in. */
function bumpChoreDraft(d, text, category){
  bump(dd => {
    dd.chores.all = dd.chores.all || [];
    dd.chores.tasks = dd.chores.tasks || [];
    dd.chores.tasks_done = dd.chores.tasks_done || [];
    let existing = null;
    if(d.path){
      const pull = arr => { const i = arr.findIndex(x => x.path === d.path); return i < 0 ? null : arr.splice(i,1)[0]; };
      existing = pull(dd.chores.all) || pull(dd.chores.tasks) || pull(dd.chores.tasks_done);
    }
    const path = d.path || `50 Chores/Definitions/${safeName(text)}.md`;
    const base = {
      name: text, text, category,
      due_recur: d.due_recur,
      due_day: d.due_recur === 'monthly' ? (parseInt(d.due_day, 10) || null) : null,
      due_weekday: d.due_recur === 'weekly' ? Number(d.due_weekday) : null,
      due_every_days: d.due_recur === 'every_n_days' ? (parseInt(d.due_every_days, 10) || 0) : 0,
      times_per_period: d.due_recur ? (parseInt(d.times_per_period, 10) || 1) : 1,
      area: d.area || '', pet: d.pet || '',
      due_time: d.due_time || '', notifications: (d.notifications||[]).map(formatNotificationToken),
      path,
    };
    if(d.due_recur){
      const wasRecurring = existing && existing.due_recur;
      const rec = { ...base,
        last_done: wasRecurring ? existing.last_done || '' : '',
        streak: wasRecurring ? existing.streak || 0 : 0,
        done_this_period: wasRecurring ? existing.done_this_period || 0 : 0,
        due: wasRecurring ? !!existing.due : false,
        overdue_days: wasRecurring ? existing.overdue_days || 0 : 0,
        next_due: wasRecurring ? existing.next_due || '' : '',
      };
      rec.remaining = Math.max(0, rec.times_per_period - rec.done_this_period);
      dd.chores.all.unshift(rec);
    } else {
      const occ = localDueOccurrence({due_recur:'', due_date: d.due_date}, todayISO());
      const done = existing ? !!existing.done : false;
      const nextId = existing ? existing.id
        : 1 + Math.max(-1, ...dd.chores.tasks.map(t => t.id), ...dd.chores.tasks_done.map(t => t.id));
      const rec = { ...base, due_date: d.due_date || '', due_today: occ.due_today, next_date: occ.next_date,
        done, done_date: existing ? existing.done_date || '' : '', id: nextId };
      (done ? dd.chores.tasks_done : dd.chores.tasks).unshift(rec);
    }
  });
}

/* Builds a brand-new chore note -- 50 Chores/Definitions/{name}.md,
   type: chore. c.due_recur set makes it recurring (the traditional "chore"
   sense, processed by update_chores.py from the completion log); blank
   makes it one-time (what the app calls a "task" -- same object, see
   CLAUDE.md #25). text carries the display title independently of the
   filename -- only meaningful for a one-time item (build_summary.py falls
   back to the filename otherwise); a recurring chore's displayed name is
   always its filename (n["_name"]), so text is written but never read
   back there. Editing an existing note goes through updateChore() instead
   (this only ever creates), which is also how a chore is converted between
   recurring and one-time -- "the object is a chore, meaning it can be
   updated to recur" (see CLAUDE.md #25). */
async function saveChore(c){
  const filename = safeName(c.name);
  if(!filename) throw new Error('Needs a name');
  const path = vpath(`50 Chores/Definitions/${filename}.md`);
  const recur = ['daily','weekly','monthly','every_n_days'].includes(c.due_recur) ? c.due_recur : '';
  const body = fm({
    type:'chore', category:c.category || 'home', text:c.name,
    due_recur:recur,
    due_date: recur ? '' : (c.due_date || todayISO()),
    due_day: recur === 'monthly' ? c.due_day : '',
    due_weekday: recur === 'weekly' ? c.due_weekday : '',
    due_every_days: recur === 'every_n_days' ? (c.due_every_days || 1) : '',
    times_per_period: recur ? (c.times_per_period || 1) : '',
    area:c.area || '', pet:c.pet || '',
    active:true, last_done:'', streak:0, done_this_period:0,
    due:'', overdue_days:0, next_due:'',
    due_time: c.due_time || '',
    notifications: (c.notifications || []).map(formatNotificationToken),
    done:false, done_date:'',
    tags:['chore']
  }) + `\n# ${filename}\n\nAdded from the phone on ${todayISO()}.\n`;
  return write(path, body, `Add chore: ${filename}`, { mode:'update' });
}

/* Patches an existing chore's frontmatter in place — category, Repeats and
   whatever due-date field/times_per_period it needs, area, pet, due_time,
   notifications, active, and (one-time items only) text — see
   choreChanges(). Renaming a recurring chore isn't supported here (that
   means moving the file); edit the note directly in Obsidian for that.
   Goes through writePending() (see above), not a bare getFile()+write(),
   for the same reason setTaskNoteDone() does: edit a chore/task quickly
   enough after adding it -- easy to do, since sheetEditChore() opens right
   from the item bumpChoreDraft() just added to the list -- and its own
   saveChore() write might still only be sitting in the queue. */
async function updateChore(c, changes){
  return writePending(vpath(c.path), md => {
    let out = md;
    for(const [k, v] of Object.entries(changes)) out = setFm(out, k, v);
    return out;
  }, `Update chore: ${c.name}`);
}

/* Same patch-in-place pattern as updateChore -- a goal's "name" is its
   filename (see build_summary.py, which reads it from n["_name"], not a
   frontmatter field), so renaming isn't offered here either; domain,
   status, metric, unit, and target are. current_value stays owned by
   "Update progress" (submitGoal/sheetGoal above) rather than this sheet,
   since that's also what appends a Progress log row -- editing it here
   too would let the two silently disagree about what "current" means. */
async function updateGoal(g, changes){
  const cur = await getFile(vpath(g.path));
  if(!cur) throw new Error('Goal file missing');
  let md = cur.text;
  for(const [k, v] of Object.entries(changes)) md = setFm(md, k, v);
  return write(vpath(g.path), md, `Update goal: ${g.name}`, { mode:'update' });
}

/* Deliberately narrow -- category and exempt (whether it counts toward
   spent_today/month/30d and categories, see build_summary.py) are the only
   two fields a transaction can be edited through the app. Amount, merchant,
   account, and date stay Obsidian-only: a wrong dollar figure silently
   entering the financial record is worse than the inconvenience of fixing
   it by hand, the same reasoning the dictation prompt already applies to
   never guessing an amount in the first place. */
async function updateTransaction(t, changes){
  const cur = await getFile(vpath(t.path));
  if(!cur) throw new Error('Transaction file missing');
  let md = cur.text;
  for(const [k, v] of Object.entries(changes)) md = setFm(md, k, v);
  return write(vpath(t.path), md, `Update transaction: ${t.merchant}`, { mode:'update' });
}

async function saveAchievement(a){
  const path = vpath(`40 Life/Achievements/${a.date} ${safeName(a.title)}.md`);
  const body = fm({ type:'achievement', date:a.date, domain:a.domain, tags:['achievement'] })
    + `\n# ${a.title}\n\n${a.note || ''}\n\nLogged on [[10 Daily/${a.date}|${a.date}]].\n`;
  return write(path, body, `Achievement: ${a.title}`);
}

/* Frontmatter-only patch, same pattern as updateChore/updateGoal -- an
   achievement's "name" is its filename (date + title, see saveAchievement
   above), so renaming isn't offered here; domain and date are. The note
   body is freeform prose the app never parses back out, so it's left
   alone rather than risking a blind overwrite if a hand-edited file
   doesn't match the shape saveAchievement() generates. */
async function updateAchievement(a, changes){
  const cur = await getFile(vpath(a.path));
  if(!cur) throw new Error('Achievement file missing');
  let md = cur.text;
  for(const [k, v] of Object.entries(changes)) md = setFm(md, k, v);
  return write(vpath(a.path), md, `Update achievement: ${a.name}`, { mode:'update' });
}

/* Real delete, not the soft active:false "Remove chore" a recurring chore
   gets (submitRemoveChoreDraft) -- a one-time due chore has no streak
   history worth keeping, matching the original due-date sheet's behavior. */
async function deleteDueChore(c){
  if(!c.path) throw new Error('Nothing to delete');
  const cur = await getFile(vpath(c.path));
  if(!cur) throw new Error('Chore note missing');
  return deleteFile(vpath(c.path), cur.sha, `Delete: ${c.text}`);
}

/* Holiday / day off / event — suppresses due-chores and push reminders for
   every date from start_date through end_date, inclusive. See update_chores.py
   and send.js, which both read these notes to decide what to skip.
   schedule (workday/weekend, send.js only) overrides which notification
   schedule applies for the date regardless of the actual day of the week.
   suppress:false makes it a "schedule only" exemption — it stops counting
   as a blanket notification-suppressor just because chores/notifications
   are empty, which they otherwise always mean. */
async function saveExemption(e){
  const label = safeName(e.note || EXEMPTION_LABELS[e.kind] || e.kind);
  const path = vpath(`40 Life/Exemptions/${e.start_date} ${label}.md`);
  // Empty chores/notifications means "everything" — update_chores.py and
  // send.js both treat an absent/empty list that way.
  const body = fm({ type:'exemption', kind:e.kind, start_date:e.start_date, end_date:e.end_date,
    chores: e.chores || [], notifications: e.notifications || [],
    schedule: e.schedule || '', suppress: e.suppress === false ? false : true,
    note: e.note || '', tags:['exemption'] }) + `\n# ${label}\n\nAdded from the phone on ${todayISO()}.\n`;
  return write(path, body, `Exemption: ${label}`, { mode:'update' });
}

/* ---- talk view ---- */

function opLabel(op){
  if(op.summary) return op.summary;
  switch(op.type){
    case 'expense': return `${money(op.amount)} at ${op.merchant}`;
    case 'income':  return `${money(op.amount)} from ${op.merchant}`;
    case 'workout': return `${op.activity}, ${op.duration_min} min`;
    case 'metric':  return `Body metrics`;
    case 'checkin': return `Daily check-in`;
    case 'goal_progress': return `Goal → ${op.value}`;
    case 'task_done': return `Complete a task`;
    case 'task_add': return `New task: ${op.text}`;
    case 'achievement': return `Achievement: ${op.title}`;
    case 'chore_done': return `${op.chore}${op.times > 1 ? ` ×${op.times}` : ''} done`;
    case 'chore_add': return `New chore: ${op.name}`;
    case 'exemption': return `${EXEMPTION_LABELS[op.kind] || op.kind}: ${op.note || op.start_date}`;
    default: return op.type;
  }
}
const OP_ICON = { expense:'💵', income:'💰', workout:'🏃', metric:'⚖️', checkin:'📝',
                  goal_progress:'🎯', task_done:'✅', task_add:'📌', achievement:'🏆',
                  chore_done:'🧹', chore_add:'🧺', exemption:'📅' };

function opDetail(op){
  const bits = [];
  if(op.due_recur === 'daily') bits.push('due daily');
  else if(op.due_recur === 'weekly' && op.due_weekday != null) bits.push(`due weekly, ${WEEKDAY_LABELS[String(op.due_weekday)] || '?'}`);
  else if(op.due_recur === 'monthly' && op.due_day) bits.push(`due monthly, day ${op.due_day}`);
  else if(op.due_recur === 'every_n_days') bits.push(`every ${op.due_every_days || '?'} days`);
  else if(op.due_date) bits.push(`due ${op.due_date}`);
  if(op.due_time) bits.push(roundHalfHour(op.due_time));
  if(op.date) bits.push(op.date);
  if(op.start_date) bits.push(op.end_date && op.end_date !== op.start_date
    ? `${op.start_date} → ${op.end_date}` : op.start_date);
  if(op.category) bits.push(op.category);
  if(op.account) bits.push(op.account);
  if(op.intensity) bits.push(op.intensity);
  if(op.journal) bits.push('journal entry');
  if(op.win) bits.push('win recorded');
  if(op.note) bits.push(op.note.slice(0, 40));
  return bits.join(' · ');
}

function toggleOp(i){ PENDING[i]._off = !PENDING[i]._off; render(); }

function quickAsk(json){
  const q = JSON.parse(json);
  const box = document.getElementById('t_input');
  if(box){ box.value = (box.value ? box.value + ' ' : '') + q + ' — '; box.focus(); }
}

function newSession(){ CHAT = []; PENDING = []; window.__questions = []; render(); }

async function sendUpdate(btn){
  const text = val('t_input');
  if(!text) return toast('Say something first');
  THINKING = true; render();
  try {
    const out = await askClaude(text);
    PENDING = (out.operations || []).map(o => ({ ...o, _off:false }));
    window.__questions = out.done ? [] : (out.questions || []);
