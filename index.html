async function commitOps(btn){
  const live = PENDING.filter(o => !o._off);
  if(!live.length) return toast('Nothing selected');
  btn.disabled = true;
  let ok = 0, failed = [];
  for(let i = 0; i < live.length; i++){
    btn.textContent = `Writing ${i+1} of ${live.length}…`;
    try { await runOp(live[i]); ok++; }
    catch(e){ failed.push(opLabel(live[i]) + ': ' + e.message); }
  }
  PENDING = [];
  render();
  toast(failed.length ? `${ok} written, ${failed.length} failed — ${failed[0]}`
                      : `${ok} written to your vault`);
  setTimeout(() => refresh(true), 1500);
}

/* ============================ paystub upload ============================ */

/* Payroll providers offer no personal API — Paylocity, ADP and the rest gate it
   behind a partner program. So the phone becomes the bridge: pick the PDF you
   downloaded, commit it to the vault, and a GitHub Action parses it and deletes it. */

function bytesToB64(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  const CHUNK = 0x8000;
  for(let i = 0; i < bytes.length; i += CHUNK){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}

function pickPaystub(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/pdf,.pdf';
  input.onchange = () => { if(input.files && input.files[0]) uploadPaystub(input.files[0]); };
  input.click();
}

async function uploadPaystub(file){
  if(!configured()) return toast('Connect your vault first');
  if(file.size > 8 * 1024 * 1024) return toast('That file is over 8 MB — is it really a paystub?');
  toast('Uploading ' + file.name + '…', 6000);
  try {
    const buf = await file.arrayBuffer();
    const clean = file.name.replace(/[^A-Za-z0-9._-]/g, '_');
    const path = vpath(`20 Finance/Income/inbox/${todayISO()}-${clean}`);
    await putFile(path, null, `Upload paystub ${clean}`, undefined, bytesToB64(buf));
    toast('Uploaded. It will be parsed and the PDF deleted within a minute.', 5000);
    setTimeout(() => refresh(true), 45000);
  } catch(e){
    toast('Upload failed: ' + e.message);
  }
}

/* ============================ chores ============================ */

/* Logging a chore appends one row to the month's log. A GitHub Action then works
   out due dates and streaks from that log. Keeping the phone's job to a single
   append is what makes ticking something off feel instant. */

const CHORE_LOG_HEADER = '| Date | Time | Chore | Note |\n|---|---|---|---|\n';

function choreLogPath(d){ return vpath(`50 Chores/Log/${d.slice(0,7)}.md`); }

function newChoreLog(month){
  return `---\ntype: chore_log\nmonth: ${month}\ntags: [chore]\n---\n\n` +
         `# Chore log — ${month}\n\nAppend-only. The phone writes here; do not edit by hand.\n\n` +
         CHORE_LOG_HEADER;
}

async function logChore(name, note){
  const date = todayISO();
  const time = new Date().toTimeString().slice(0,5);
  const path = choreLogPath(date);
  let md;
  try {
    const cur = await getFile(path);
    md = cur ? cur.text : newChoreLog(date.slice(0,7));
  } catch(e){ md = newChoreLog(date.slice(0,7)); }
  if(!md.includes(CHORE_LOG_HEADER)) md = md.trimEnd() + '\n\n' + CHORE_LOG_HEADER;
  md = md.trimEnd() + `\n| ${date} | ${time} | ${name} | ${(note||'').replace(/\|/g,'/')} |\n`;
  const r = await write(path, md, `Chore: ${name}`, { mode:'update' });
  bumpChore(name);
  return r;
}

/* reflect the tick immediately — CI updates the real numbers within the minute */
function bumpChore(name){
  bump(d => {
    if(!d.chores) return;
    const c = (d.chores.all || []).find(x => x.name === name);
    if(!c) return;
    c.done_this_period = (c.done_this_period || 0) + 1;
    c.remaining = Math.max(0, (c.times_per_period || 1) - c.done_this_period);
    c.last_done = todayISO();
    if(c.remaining === 0){
      c.due = false; c.overdue_days = 0;
      d.chores.due = (d.chores.due || []).filter(x => x.name !== name);
      d.chores.overdue = (d.chores.overdue || []).filter(x => x.name !== name);
    }
    d.chores.due_count = (d.chores.due || []).length;
    d.chores.overdue_count = (d.chores.overdue || []).length;
  });
}

/* Undo for a chore ticked off today -- removes the log row logChore() just
   appended rather than adding a *third* writer that pokes done_this_period/
   due directly (CLAUDE.md #11 is only about the two writers that already
   exist, the phone's log-append and update_chores.py's derive-from-log
   pass, but the spirit -- don't hand-patch what the log is supposed to be
   the one source of truth for -- applies just as much to removing a
   completion as adding one). Always targets the LAST row matching this
   chore on today's date, i.e. "undo the most recent thing I did" -- there's
   no picker for which of several same-day ticks to remove, and callers
   only offer this for last_done === today (see viewChores()) so there's
   always at least one such row to find. No offline fallback on purpose,
   unlike logChore(): appending can safely start a fresh log file if the
   current one can't be read, but removing a specific row can't -- without
   the real remote content there's nothing to safely remove. */
async function unlogChore(name){
  const date = todayISO();
  const path = choreLogPath(date);
  const cur = await getFile(path);
  if(!cur) throw new Error('No log entry found for today');
  const lines = cur.text.split('\n');
  let lastIdx = -1;
  for(let i = 0; i < lines.length; i++){
    const m = lines[i].match(/^\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|\s*$/);
    if(m && m[1] === date && m[3] === name) lastIdx = i;
  }
  if(lastIdx < 0) throw new Error('No matching log entry found for today');
  lines.splice(lastIdx, 1);
  return write(path, lines.join('\n'), `Undo chore: ${name}`, { mode:'update' });
}

/* Reverses bumpChore()'s local reflection. streak isn't touched here --
   same reasoning as bumpChoreDraft: only update_chores.py replaying the
   full log can really derive it, and a stale streak self-corrects on the
   next real summary rebuild same as it already does elsewhere. What DOES
   need to flip immediately is whatever put this chore in "Done, and when
   it comes back" in the first place, or the undo looks like it silently
   failed until CI catches up. */
function bumpChoreUndo(name){
  bump(d => {
    if(!d.chores) return;
    const c = (d.chores.all || []).find(x => x.name === name);
    if(!c) return;
    c.done_this_period = Math.max(0, (c.done_this_period || 0) - 1);
    c.remaining = (c.times_per_period || 1) - c.done_this_period;
    if(c.done_this_period === 0) c.last_done = '';
    c.due = true; c.overdue_days = 0;
    d.chores.due = d.chores.due || [];
    if(!d.chores.due.some(x => x.name === name)) d.chores.due.unshift(c);
    d.chores.due_count = d.chores.due.length;
  });
}

const FREQ_LABEL = c => c.due_recur === 'every_n_days'
  ? `Every ${c.due_every_days} days`
  : (CHORE_FREQ_LABELS[c.due_recur] || c.due_recur) + (c.times_per_period > 1 ? ` ×${c.times_per_period}` : '');

function choreRow(c, i){
  const late = c.overdue_days > 0;
  const progress = c.times_per_period > 1 ? `${c.done_this_period || 0} of ${c.times_per_period}` : '';
  const bits = [FREQ_LABEL(c), c.area, progress].filter(Boolean).join(' · ');
  // Everything but the tick opens the edit sheet — tapping the segment
  // itself is how each chore's category/frequency/schedule gets changed.
  return `<div class="item">
    <div style="display:flex;gap:11px;align-items:center;flex:1;min-width:0">
      <button class="tick" onclick="tickChore(${i}, this)" aria-label="mark done">✓</button>
      <button style="min-width:0;flex:1;text-align:left;background:none;border:none;padding:0"
        onclick="sheetEditChore(${i})">
        <div class="m">${esc(c.name)}${c.category === 'pets' ? ' <span class="pill">pets</span>' : ''}</div>
        <div class="s">${esc(bits)}</div>
      </button>
    </div>
    ${late ? `<div class="amt bad">${c.overdue_days}d late</div>`
           : c.last_done ? `<div class="s" style="white-space:nowrap">${esc(c.last_done)}</div>` : ''}
  </div>`;
}

let CHOREREFS = [];
function choreRef(c){ CHOREREFS.push(c); return CHOREREFS.length - 1; }

async function tickChore(i, btn){
  const c = CHOREREFS[i];
  if(!c) return toast('Chore not found');
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await logChore(c.name, '');
    render();
    toast(r === 'queued' ? `${c.name} saved on device` : `${c.name} done`);
  } catch(e){
    btn.disabled = false; btn.textContent = '✓';
    toast('Failed: ' + e.message);
  }
}

async function undoChore(i, btn){
  const c = CHOREREFS[i];
  if(!c) return toast('Chore not found');
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await unlogChore(c.name);
    bumpChoreUndo(c.name);
    render();
    toast(r === 'queued' ? `${c.name} saved on device` : `${c.name} marked not done`);
  } catch(e){
    btn.disabled = false; btn.textContent = 'Undo';
    toast('Failed: ' + e.message);
  }
}

/* ---- chores: filter by subject / location / frequency ---- */
// Values are re-populated on every render() (same lifecycle as CHOREREFS)
// and clicked by index, so free-text areas never need to survive an
// onclick-attribute round trip.
let CHORE_FILTER = { category:'all', area:'all', freq:'all' };
let CHORE_FILTER_OPTS = { category:[], area:[], freq:[] };

function choreFilterActive(){
  return CHORE_FILTER.category!=='all' || CHORE_FILTER.area!=='all' || CHORE_FILTER.freq!=='all';
}
function choreMatchesFilter(c){
  if(CHORE_FILTER.category!=='all' && c.category !== CHORE_FILTER.category) return false;
  if(CHORE_FILTER.area!=='all' && (c.area||'') !== CHORE_FILTER.area) return false;
  if(CHORE_FILTER.freq!=='all' && c.due_recur !== CHORE_FILTER.freq) return false;
  return true;
}
function setChoreFilterIdx(kind, idx){ CHORE_FILTER[kind] = CHORE_FILTER_OPTS[kind][idx]; render(); }
function clearChoreFilters(){ CHORE_FILTER = {category:'all', area:'all', freq:'all'}; render(); }

function choreFilterChips(kind, opts, labelFor, sel){
  CHORE_FILTER_OPTS[kind] = opts;
  return `<div class="chips">` + opts.map((v,i) =>
    `<button type="button" class="chip ${v===sel?'on':''}" onclick="setChoreFilterIdx('${kind}',${i})">
      ${esc(labelFor(v))}</button>`).join('') + `</div>`;
}

function renderChoreFilters(ch){
  const areas = [...new Set((ch.all||[]).map(c => c.area).filter(Boolean))].sort();
  const active = choreFilterActive();
  const body = `<div class="filter-bar">
    <label>Subject</label>
    ${choreFilterChips('category', ['all', ...CHORE_CATEGORIES],
      v => v==='all' ? 'All' : (CHORE_CATEGORY_LABELS[v]||v), CHORE_FILTER.category)}
    ${areas.length ? `<label>Location</label>
    ${choreFilterChips('area', ['all', ...areas], v => v==='all' ? 'All' : v, CHORE_FILTER.area)}` : ''}
    <label>Frequency</label>
    ${choreFilterChips('freq', ['all', ...CHORE_FREQS],
      v => v==='all' ? 'All' : (CHORE_FREQ_LABELS[v]||v), CHORE_FILTER.freq)}
    ${active ? `<button type="button" class="chip" style="margin-top:12px;opacity:.7"
      onclick="clearChoreFilters()">✕ Clear filters</button>` : ''}
  </div>`;
  return collapsible('chorefilters', 'Filters', body, {subtitle: active ? 'active' : ''});
}

function viewChores(){
  const d = DATA;
  let h = header('Chores', d && d.chores
    ? `${d.chores.due_count} due` + ((d.chores.tasks||[]).length ? ` · ${d.chores.tasks.length} task${d.chores.tasks.length>1?'s':''}` : '')
    : '');
  if(!configured()) return h + needsSetup();
  if(!d || !d.chores) return h + `<div class="empty">No chore data yet. Pull to refresh.</div>`;
  const ch = d.chores;

  h += renderChoreFilters(ch);

  // Overdue -- pinned above everything else and never collapsible, on
  // purpose: it's the one thing on this tab that should never take a tap
  // to reveal. Pools both flavors of "late" (CLAUDE.md #25) -- a recurring
  // chore past its due date (ch.overdue, overdue_days>0, already sorted
  // worst-first by build_summary.py) and a one-time task whose next_date
  // has passed (no overdue_days field for those -- see taskRow) -- since
  // from here "is this late" matters more than which kind of chore it is.
  // Anything shown here is excluded from Due/Tasks below so nothing is
  // ever listed twice.
  const allTasks = d.chores.tasks || [];
  const isOverdueTask = t => !!(t.next_date && t.next_date < todayISO());
  const overdueChores = (ch.overdue || []).filter(choreMatchesFilter);
  const overdueTasks = allTasks.filter(isOverdueTask).filter(choreMatchesFilter)
    .sort((a, b) => a.next_date.localeCompare(b.next_date));
  if(overdueChores.length || overdueTasks.length){
    h += `<h2>Overdue</h2><div class="list">`
      + overdueChores.map(c => choreRow(c, choreRef(c))).join('')
      + overdueTasks.map(t => taskRow(t)).join('')
      + `</div>`;
  }

  // Tasks -- a chore that hasn't been set to recur (CLAUDE.md #25). Lives
  // here, not on the Life tab, same as everything else chore-shaped;
  // there's no separate lightweight object for a quick one-liner anymore,
  // just a chore note with due_recur blank. Adding one goes through the
  // same "Add a chore" sheet below (Repeats: One time) as everything
  // else -- a second, stripped-down quick-add input here duplicated that
  // sheet for no real benefit, right down to its own hint text pointing
  // back at the real one. Overdue ones already showed above.
  const tasks = allTasks.filter(t => !isOverdueTask(t)).filter(choreMatchesFilter);
  h += `<h2>Tasks</h2>`;
  h += tasks.length
    ? `<div class="list">` + tasks.map(t => taskRow(t)).join('') + `</div>`
    : `<div class="empty">${choreFilterActive()
        ? 'No open tasks match these filters.' : 'Nothing open. Add one with "Add a chore" below.'}</div>`;

  const due = (ch.due || []).filter(c => c.overdue_days === 0).filter(choreMatchesFilter);
  h += `<h2>Due${due.length ? '' : ' — nothing else'}</h2>`;
  if(!due.length){
    h += `<div class="card"><span class="sub">${choreFilterActive()
      ? 'Nothing due matches these filters.' : 'Everything is done. Go and enjoy that.'}</span></div>`;
  } else {
    // Category groups start collapsed (see OPEN_SECTIONS above) since
    // what's actually urgent already surfaced in Overdue; forceOpen pops
    // a group back open whenever a filter is active, so narrowing to e.g.
    // "Pets" never hides its own matches behind a closed section.
    const groups = CHORE_CATEGORIES
      .map(cat => ({cat, items: due.filter(c => c.category === cat)}))
      .filter(g => g.items.length);
    h += groups.map(g => collapsible(`chorecat:${g.cat}`, CHORE_CATEGORY_LABELS[g.cat] || g.cat,
      `<div class="list">` + g.items.map(c => choreRow(c, choreRef(c))).join('') + `</div>`,
      {subtitle: String(g.items.length), forceOpen: choreFilterActive()})).join('');
  }

  const completed = d.chores.tasks_done || [];
  if(completed.length){
    // Completion isn't permanent (CLAUDE.md #21) -- tapping a row's tick
    // here moves it straight back into Tasks (toggleTask), same component
    // as the list above, just fed the other array.
    h += collapsible('completed_tasks', 'Completed',
      `<div class="list">` + completed.map(t => taskRow(t, {hidePill:true})).join('') + `</div>`,
      {subtitle: String(completed.length)});
  }

  const notDue = (ch.all || []).filter(c => !c.due && choreMatchesFilter(c));
  if(notDue.length){
    h += `<h2>Done, and when it comes back</h2><div class="list">` + notDue.map(c => { const i = choreRef(c);
      // Undo only ever targets a completion that happened today -- a chore
      // finished yesterday or earlier has no "last thing I did" to walk
      // back from here, and picking a specific old log row to remove would
      // need a date to remove it FROM, which this list doesn't show (see
      // undoChore()/unlogChore() below for why today-only keeps this safe).
      const doneToday = c.last_done === todayISO();
      return `<div class="item">
        <button style="min-width:0;flex:1;text-align:left;background:none;border:none;padding:0"
          onclick="sheetEditChore(${i})">
          <div class="m muted">${esc(c.name)}</div>
          <div class="s">${esc(FREQ_LABEL(c))}${c.streak > 1 ? ` · ${c.streak} in a row` : ''}</div>
        </button>
        ${doneToday
          ? `<button type="button" class="chip" style="padding:6px 10px;font-size:12px"
              onclick="undoChore(${i}, this)">Undo</button>`
          : `<div class="s" style="white-space:nowrap">${esc(c.next_due || '')}</div>`}
      </div>`; }).join('') + `</div>`;
  }

  h += `<h2>Add a chore</h2><div class="card"><p class="sub" style="margin:0 0 10px">
    Tap any chore above to edit its category, frequency, or schedule directly.</p>
    <button class="btn sec" onclick="sheetAddChore('daily')">Add a chore</button></div>`;
  return h;
}

/* ============================ calendar ============================ */

let CAL_MODE = 'month';   // 'month' | 'week'
let CAL_OFFSET = 0;       // months (month mode) or weeks (week mode) from today

function activityScore(day){
  return (day.chores||0) + (day.workout?1:0) + (day.checkin?1:0) + (day.goal_progress||0);
}
function heatClass(score){
  if(score <= 0) return '';
  if(score === 1) return 'h1';
  if(score === 2) return 'h2';
  if(score <= 4) return 'h3';
  return 'h4';
}
function calDayMap(d){
  const m = {};
  (d.calendar.days||[]).forEach(x => m[x.date] = x);
  return m;
}
function isoOf(y, mo, day){ return `${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; }

function viewCalendar(){
  const d = DATA;
  const activeStreaks = d ? (d.calendar.goal_streaks||[]).filter(g => g.streak > 0) : [];
  let h = header('Calendar', activeStreaks.length
    ? `${activeStreaks.length} streak${activeStreaks.length>1?'s':''} going` : '');
  if(!configured()) return h + needsSetup();
  if(!d || !d.calendar) return h + `<div class="empty">No calendar data yet. Pull to refresh.</div>`;

  h += `<div class="row" style="margin-top:10px">
    <div class="chips">
      <button class="chip ${CAL_MODE==='week'?'on':''}" onclick="setCalMode('week')">Week</button>
      <button class="chip ${CAL_MODE==='month'?'on':''}" onclick="setCalMode('month')">Month</button>
    </div>
    <button class="btn sec" style="width:auto;padding:9px 14px" onclick="sheetAddExemption()">+ Exemption</button>
  </div>`;

  if(activeStreaks.length){
    // streak is period-agnostic (day/week/month, per each goal's own
    // due_recur -- see build_summary.py's goal_streak()), so the unit
    // shown has to track that instead of always saying "wk".
    const streakUnit = r => r === 'daily' ? 'd' : r === 'monthly' ? 'mo' : 'wk';
    h += `<div class="streak-row">` + activeStreaks.map(g =>
      `<div class="streak-badge">🔥 <b>${g.streak}</b> ${streakUnit(g.due_recur)} · ${esc(g.name)}</div>`).join('') + `</div>`;
  }

  h += CAL_MODE === 'month' ? renderCalMonth(d) : renderCalWeek(d);

  const ex = d.exemptions || [];
  h += `<h2>Exemptions${ex.length ? '' : ' — none set'}</h2>`;
  h += ex.length
    ? `<div class="list">` + ex.map((e, i) => `<div class="item">
        <button style="min-width:0;flex:1;text-align:left;background:none;border:none;padding:0"
          onclick="sheetEditExemption(${i})">
        <div class="m">${esc(e.note || EXEMPTION_LABELS[e.kind] || e.kind)}${
          e.schedule ? ` <span class="pill">${esc(SCHEDULE_OVERRIDE_LABELS[e.schedule] || e.schedule)}</span>` : ''}</div>
        <div class="s">${esc(EXEMPTION_LABELS[e.kind] || e.kind)} · ${esc(e.start_date)}${
          e.end_date !== e.start_date ? ' → ' + esc(e.end_date) : ''} · ${esc(exemptionScopeLabel(e))}</div>
        </button>
      </div>`).join('') + `</div>`
    : `<div class="card"><span class="sub">No holidays, days off, or events set — chores and
        reminders run normally every day.</span></div>`;
  return h;
}

function setCalMode(m){ CAL_MODE = m; CAL_OFFSET = 0; render(); }
function calNav(delta){ CAL_OFFSET += delta; render(); }

function renderCalMonth(d){
  const map = calDayMap(d);
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + CAL_OFFSET);
  const year = base.getFullYear(), month = base.getMonth();
  const startWeekday = (new Date(year, month, 1).getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = base.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  const today = todayISO();

  let cells = '';
  for(let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell pad"></div>`;
  for(let day = 1; day <= daysInMonth; day++){
    const iso = isoOf(year, month, day);
    const rec = map[iso];
    const score = rec ? activityScore(rec) : 0;
    const cls = ['cal-cell', heatClass(score), iso===today?'today':'', rec&&rec.exempt?'exempt':'']
      .filter(Boolean).join(' ');
    cells += `<button class="${cls}" onclick="sheetDayDetail('${iso}')">${day}</button>`;
  }
  return `<div class="cal-nav">
      <button class="btn sec" style="width:auto;padding:8px 14px" onclick="calNav(-1)">‹</button>
      <b>${esc(monthLabel)}</b>
      <button class="btn sec" style="width:auto;padding:8px 14px" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">
      ${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x => `<div class="cal-dow">${x}</div>`).join('')}
      ${cells}
    </div>`;
}

function renderCalWeek(d){
  const map = calDayMap(d);
  const today = new Date();
  const base = new Date(today); base.setDate(today.getDate() + CAL_OFFSET * 7);
  const monday = new Date(base); monday.setDate(base.getDate() - ((base.getDay() + 6) % 7));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const todayIso = todayISO();
  const labels = ['Mo','Tu','We','Th','Fr','Sa','Su'];

  let cells = '';
  for(let i = 0; i < 7; i++){
    const dt = new Date(monday); dt.setDate(monday.getDate() + i);
    const iso = isoOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
    const rec = map[iso];
    const score = rec ? activityScore(rec) : 0;
    const cls = ['cal-cell', heatClass(score), iso===todayIso?'today':'', rec&&rec.exempt?'exempt':'']
      .filter(Boolean).join(' ');
    cells += `<button class="${cls}" onclick="sheetDayDetail('${iso}')">
      <span style="font-size:9px;opacity:.8">${labels[i]}</span><span>${dt.getDate()}</span>
    </button>`;
  }
  const rangeLabel = `${monday.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – `
    + `${sunday.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  return `<div class="cal-nav">
      <button class="btn sec" style="width:auto;padding:8px 14px" onclick="calNav(-1)">‹</button>
      <b>${esc(rangeLabel)}</b>
      <button class="btn sec" style="width:auto;padding:8px 14px" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-week-strip">${cells}</div>`;
}

function sheetDayDetail(iso){
  const d = DATA;
  const rec = ((d && d.calendar.days) || []).find(x => x.date === iso)
    || {date: iso, chores:0, workout:false, checkin:false, goal_progress:0, goal_checkins:[], exempt:false};
  const label = new Date(iso + 'T12:00:00').toLocaleDateString('en-US',
    {weekday:'long', month:'long', day:'numeric'});
  // goal_checkins is due-vs-done for that day's expected goal check-ins
  // (build_summary.py's due_occurrence() cross-referenced against the
  // goal's own progress-log dates) -- the one place this calendar can
  // actually show "due" for a past day; a chore's due-ness is a today-only
  // concept (see CLAUDE.md #16/#21), so chores only ever show a done count.
  const checkins = rec.goal_checkins || [];
  openSheet(`<h1 style="font-size:22px">${esc(label)}</h1>
    ${rec.exempt ? `<p class="sub">Exempt — chores and reminders are off this day.</p>` : ''}
    <div class="grid" style="margin-top:14px">
      <div class="stat"><div class="l">Chores done</div><div class="n">${rec.chores}</div></div>
      <div class="stat"><div class="l">Goal updates</div><div class="n">${rec.goal_progress}</div></div>
      <div class="stat"><div class="l">Workout</div><div class="n">${rec.workout ? '✓' : '—'}</div></div>
      <div class="stat"><div class="l">Check-in</div><div class="n">${rec.checkin ? '✓' : '—'}</div></div>
    </div>
    ${checkins.length ? `<h2 style="margin-top:18px">Goal check-ins</h2>
      <div class="list">` + checkins.map(c => `<div class="item">
        <div class="m" style="${c.done?'':'color:var(--dim)'}">${c.done?'✓':'○'} ${esc(c.name)}</div>
      </div>`).join('') + `</div>` : ''}
    ${rec.exempt ? '' : `<button class="btn sec" style="margin-top:18px"
      onclick="sheetAddExemption('${iso}')">Mark as exempt</button>`}
    <button class="btn sec" style="margin-top:8px" onclick="closeSheet()">Close</button>`);
}

const REMINDERS_PATH = '90 System/push/reminders.json';

/* Falls back to a sane default shape if the file doesn't exist yet or the
   device is offline — every caller can assume .events and .reminders exist. */
async function loadReminderConfig(){
  try {
    const f = await getFile(vpath(REMINDERS_PATH));
    if(f){ const c = JSON.parse(f.text); return { timezone_offset_hours:0, events:{}, reminders:[], ...c }; }
  } catch(e){ /* offline, unconfigured, or file doesn't exist yet */ }
  return { timezone_offset_hours: 0, events: {}, reminders: [] };
}

async function saveReminderConfig(cfg){
  return write(vpath(REMINDERS_PATH), JSON.stringify(cfg, null, 2) + '\n',
    'Update reminder schedule', { mode:'update' });
}

/* ---- Settings → Schedule: event anchor times + per-reminder frequency ---- */

let REMINDER_CFG = null, reminderCfgPromise = null;

/* Loads once (lazily), then just re-renders — mirrors how DATA itself starts
   from cache and gets refreshed async elsewhere in the app. */
function ensureReminderConfig(){

// written by track_actions_usage.py (see the workflows), read-only from here.

const ACTIONS_USAGE_PATH = '90 System/push/actions_usage.json';

function formatBytes(n){
  if(!n) return '0 B';
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

const REMINDER_ANCHORS = ['wake','sleep','work_start','work_end','fixed'];
const ANCHOR_LABELS = { wake:'Wake', sleep:'Sleep', work_start:'Start work', work_end:'End work', fixed:'Fixed time' };
const REMINDER_FREQS = ['daily','weekdays','weekends','weekly','off'];
const FREQ_DISPLAY = { daily:'Daily', weekdays:'Weekdays', weekends:'Weekends', weekly:'Weekly', off:'Off' };
// send.js's own convention (JS Date#getDay after shifting to local time): 0=Sunday..6=Saturday.
const WEEKDAYS = ['0','1','2','3','4','5','6'];
const WEEKDAY_LABELS = { '0':'Sun', '1':'Mon', '2':'Tue', '3':'Wed', '4':'Thu', '5':'Fri', '6':'Sat' };
const WEEKDAY_FULL_LABELS = { '0':'Sunday', '1':'Monday', '2':'Tuesday', '3':'Wednesday',
  '4':'Thursday', '5':'Friday', '6':'Saturday' };
const DEFAULT_WORK_ENABLED = { '0':false, '1':true, '2':true, '3':true, '4':true, '5':true, '6':false };

// An exemption can borrow a whole other day's schedule instead of today's —
// same digit convention as WEEKDAYS, '' meaning no override.
const SCHEDULE_OVERRIDES = ['', ...WEEKDAYS];
const SCHEDULE_OVERRIDE_LABELS = { '': 'Normal', ...WEEKDAY_LABELS };

function reminderScheduleLabel(r){
  if(r.anchor === 'fixed') return `${r.time || '—'} local`;
  const off = Number(r.offset_min || 0);
  return `${ANCHOR_LABELS[r.anchor] || r.anchor}${off ? ` ${off > 0 ? '+' : ''}${off} min` : ''}`;
}

/* Builds day_schedule from the older shared-events config shape when it
 * hasn't been saved under the new per-day one yet — mirrors send.js's
 * migrateDaySchedule() exactly, so Settings shows the same effective
 * schedule send.js would actually use, and saving once carries it forward
 * without losing anything already configured. */
function deriveDaySchedule(rc){
  if(rc.day_schedule) return rc.day_schedule;
  const ev = rc.events || {};
  const we = rc.weekend_events || {};
  const workDays = new Set(Array.isArray(rc.work_days) ? rc.work_days.map(Number) : [1,2,3,4,5]);
  const out = {};
  for(const dow of WEEKDAYS){
    const enabled = workDays.has(Number(dow));
    out[dow] = { work_enabled: enabled,
      wake: (enabled ? ev.wake : (we.wake || ev.wake)) || '',
      sleep: (enabled ? ev.sleep : (we.sleep || ev.sleep)) || '',
      work_start: ev.work_start || '', work_end: ev.work_end || '',
      work_buffer_min: enabled ? (rc.work_buffer_min ?? null) : null };
  }
  return out;
}

function daySummary(c, enabled){
  if(!enabled) return 'Off';
  const bits = [];
  if(c.wake) bits.push(`wake ${c.wake}`);
  if(c.work_start && c.work_end) bits.push(`work ${c.work_start}–${c.work_end}`);
  if(c.sleep) bits.push(`sleep ${c.sleep}`);
  return bits.length ? bits.join(' · ') : 'Not set';
}

// Generic On/Off tick toggle -- not schedule-specific despite where it was
// first written; reused for any simple on/off switch (a day's work-hours
// toggle, a transaction's Exempt flag, guest mode, ...).
function toggleOnOffBtn(btn){
  btn.classList.toggle('on');
  btn.textContent = btn.classList.contains('on') ? 'On' : 'Off';
}

function renderScheduleSection(){
  if(!REMINDER_CFG) return `<div class="card"><span class="sub">Loading…</span></div>`;
  const rc = REMINDER_CFG;
  const daySchedule = deriveDaySchedule(rc);
  let h = `<div class="card">
    <label>Timezone offset from UTC, in hours</label>
    <input id="sch_tz" type="text" inputmode="numeric" value="${esc(rc.timezone_offset_hours ?? 0)}" placeholder="-5">
    <p class="sub" style="margin-top:4px">Every time below is local — this is the only thing that
    needs updating twice a year when the clocks change (e.g. -5 for US Eastern in winter, -4 in summer).</p>
  </div>
  <p class="sub" style="margin:10px 0 6px">Every day of the week has its own wake, sleep, and work
  hours — toggle a day off and its work-hours deadzone stops applying, but wake/sleep still do.</p>`;

  h += WEEKDAYS.map(dow => {
    const c = daySchedule[dow] || {};
    const enabled = c.work_enabled !== undefined ? !!c.work_enabled : DEFAULT_WORK_ENABLED[dow];
    const bufferHrs = (c.work_buffer_min === null || c.work_buffer_min === undefined) ? '' : (c.work_buffer_min/60);
    const body = `<div class="card">
      <div class="row">
        <b>Work hours apply</b>
        <button class="tick ${enabled?'on':''}" style="width:44px;height:28px;border-radius:14px"
          onclick="toggleOnOffBtn(this)" id="sch_${dow}_enabled" data-persist-toggle>${enabled?'On':'Off'}</button>
      </div>
      <label>Wake up</label><input id="sch_${dow}_wake" type="time" value="${esc(c.wake||'')}">
      <label>Sleep</label><input id="sch_${dow}_sleep" type="time" value="${esc(c.sleep||'')}">
      <label>Start work</label><input id="sch_${dow}_work_start" type="time" value="${esc(c.work_start||'')}">
      <label>End work</label><input id="sch_${dow}_work_end" type="time" value="${esc(c.work_end||'')}">
      <label>Notification deadzone, hours before work ends</label>
      <input id="sch_${dow}_buffer" type="text" inputmode="decimal" placeholder="e.g. 1.5" value="${bufferHrs}">
      <p class="sub" style="margin-top:4px">Reminders stay quiet from start of work until this many
      hours are left before it ends — 0 or blank means no exception, blank the whole field to turn the
      deadzone off entirely for this day.</p>
    </div>`;
    return collapsible(`sch_day_${dow}`, WEEKDAY_FULL_LABELS[dow], body, {subtitle: daySummary(c, enabled)});
  }).join('');

  h += `<button class="btn" style="margin-top:12px" onclick="submitScheduleEvents(this)">Save schedule</button>`;

  const reminders = rc.reminders || [];
  h += `<p class="sub" style="margin:14px 0 6px">Tap a reminder to change when it fires or how often.
  Content and wording still come from ${REMINDERS_PATH} directly.</p>`;
  h += reminders.length
    ? `<div class="list">` + reminders.map((r, i) => `<div class="item">
        <button style="min-width:0;flex:1;text-align:left;background:none;border:none;padding:0"
          onclick="sheetEditReminder(${i})">
          <div class="m">${esc(r.title || r.id)}</div>
          <div class="s">${esc(reminderScheduleLabel(r))} · ${esc(FREQ_DISPLAY[r.frequency] || r.frequency || 'Daily')}${
            r.frequency === 'weekly' ? ` (${esc(WEEKDAY_LABELS[String(r.weekday === undefined ? 0 : r.weekday)])})` : ''}</div>
        </button>
      </div>`).join('') + `</div>`
    : `<div class="card"><span class="sub">No reminders configured yet.</span></div>`;
  return h;
}

async function submitScheduleEvents(btn){
  btn.disabled = true; btn.textContent = 'Saving…';
  const cfg = REMINDER_CFG || await loadReminderConfig();
  cfg.timezone_offset_hours = parseInt(val('sch_tz'), 10) || 0;
  const day_schedule = {};
  for(const dow of WEEKDAYS){
    const enabledBtn = document.getElementById(`sch_${dow}_enabled`);
    const enabled = enabledBtn ? enabledBtn.classList.contains('on') : false;
    const bufferRaw = val(`sch_${dow}_buffer`);
    const bufferHrs = bufferRaw === '' ? null : parseFloat(bufferRaw);
    const bufferMin = (bufferHrs === null || isNaN(bufferHrs) || bufferHrs < 0) ? null : Math.round(bufferHrs * 60);
    day_schedule[dow] = { work_enabled: enabled,
      wake: val(`sch_${dow}_wake`), sleep: val(`sch_${dow}_sleep`),
      work_start: val(`sch_${dow}_work_start`), work_end: val(`sch_${dow}_work_end`),
      work_buffer_min: bufferMin };
  }
  cfg.day_schedule = day_schedule;
  // migrate off the pre-per-day fields now that day_schedule is saved —
  // deriveDaySchedule() only falls back to them when day_schedule is absent
  delete cfg.events; delete cfg.work_days; delete cfg.work_buffer_min; delete cfg.weekend_events;
  try {
    const r = await saveReminderConfig(cfg);
    REMINDER_CFG = cfg;
    toast(r === 'queued' ? 'Saved on device — will upload when online' : 'Schedule saved');
  } catch(e){ toast('Failed: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Save schedule'; render(); }
}

const EX_SCOPE_HINTS = {
  everything: 'Chores and reminders are skipped entirely on these days.',
  specific: 'Only the items picked below are skipped — everything else runs normally.',
  schedule_only: "Nothing is skipped. Only useful with a schedule override set above — "
    + "it changes the notification schedule for these days without muting anything.",
};

function setExemptScope(btn){
  document.querySelectorAll('#ex_scope .chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('ex_specific_wrap').classList.toggle('hide', btn.dataset.v !== 'specific');
  const hint = document.getElementById('ex_scope_hint');
  if(hint) hint.textContent = EX_SCOPE_HINTS[btn.dataset.v] || '';
}

async function submitAddExemption(btn){
  const start = val('ex_start') || todayISO();
  const end = val('ex_end') || start;
  const kind = picked('ex_kind') || 'holiday';
  const note = val('ex_note');
  const schedule = picked('ex_schedule');
  const scope = document.querySelector('#ex_scope .chip.on').dataset.v;
  const specific = scope === 'specific';
  const suppress = scope !== 'schedule_only';
  const chores = specific ? pickedMulti('ex_chores') : [];
  const notifications = specific ? pickedMulti('ex_notifs') : [];
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await saveExemption({ kind, start_date: start, end_date: end, note, chores, notifications,
      schedule, suppress });
    closeSheet(); render();
    toast(r === 'queued' ? 'Saved on device — will upload when online' : 'Exemption added');
  } catch(e){ toast('Failed: ' + e.message); btn.disabled = false; btn.textContent = 'Save'; }
}

function exemptionScopeLabel(e){
  if(e.suppress === false) return 'schedule only';
  const scope = [
    (e.chores||[]).length ? `${e.chores.length} chore${e.chores.length>1?'s':''}` : '',
    (e.notifications||[]).length ? `${e.notifications.length} reminder${e.notifications.length>1?'s':''}` : ''
  ].filter(Boolean).join(', ');
  return scope || 'everything';
}

async function removeExemption(i){
  const e = (DATA && DATA.exemptions || [])[i];
  if(!e || !e.path) return toast('Exemption not found');
  if(!navigator.onLine) return toast('Connect to the internet to remove this, then try again.');
  try {
    const cur = await getFile(vpath(e.path));
    if(!cur) throw new Error('Already gone');
    await deleteFile(vpath(e.path), cur.sha, `Remove exemption: ${e.note || e.kind}`);
    bump(d => { d.exemptions = (d.exemptions||[]).filter((x, idx) => idx !== i); });
    closeSheet(); render();
    toast('Exemption removed');
  } catch(err){ toast('Failed: ' + err.message); }
}

function choresStrip(){
  const ch = DATA && DATA.chores;
  if(!ch || !(ch.all || []).length) return '';

    return `<div class="card"><div class="row"><b class="good">All chores done</b>
      <span class="sub">nothing due today</span></div></div>`;
  }
  const late = due.filter(c => c.overdue_days > 0);
  // Grouped by frequency rather than one flat list -- Daily is seeded open in
  // OPEN_SECTIONS (it's the common case), Weekly/Monthly/X Days start closed
  // so a long due list doesn't bury Today under things that aren't urgent.
  const groups = CHORE_FREQS
    .map(freq => ({freq, items: due.filter(c => c.due_recur === freq)}))
    .filter(g => g.items.length);
  const body = groups.map(g => collapsible(`todayfreq:${g.freq}`, CHORE_FREQ_LABELS[g.freq] || g.freq,
    `<div class="list">` + g.items.map(c => choreRow(c, choreRef(c))).join('') + `</div>`,
    {subtitle: String(g.items.length)})).join('');

let TXNREFS = [];
function txnRef(t){ TXNREFS.push(t); return TXNREFS.length - 1; }

/* Amount/merchant/account/date are never editable here (see
   updateTransaction) -- only category and "exempt" are, via
   sheetEditTransaction. An exempt transaction stays visible (it's still
   something that happened) but reads as set-aside: greyed out and its
   amount masked the same way guest mode masks every amount, regardless of
   whether guest mode itself is on. showAccount is only true on the Money
   tab's full list -- Today's "Latest transactions" is tight on space and
   the account rarely matters there. */
function transactionRow(t, showAccount){
  const i = txnRef(t);
  const exempt = !!t.exempt;
  const amt = exempt ? forceMask(money(t.amount)) : money(t.amount);
  const sub = [t.category, showAccount ? t.account : '', t.date, exempt ? 'exempt' : ''].filter(Boolean).join(' · ');
  return `<div class="item" style="${exempt?'opacity:.45':''}">
    <button style="min-width:0;flex:1;text-align:left;background:none;border:none;padding:0" onclick="sheetEditTransaction(${i})">
      <div class="m">${esc(t.merchant)}</div>
      <div class="s">${esc(sub)}</div>
    </button>
    <div class="amt ${finClass(t.direction==='income'&&!exempt?'good':'')}">${finSign(t.direction==='income'&&!exempt)}${amt}</div>
  </div>`;
}

function sheetEditTransaction(i){

  openSheet(`<h1 style="font-size:22px">${esc(t.merchant)}</h1>
    <p class="sub">${esc(t.date)} · ${t.direction==='income'?'received':'spent'} ${esc(money(t.amount))}

const VIEWS = { today:viewToday, chores:viewChores, talk:viewTalk, money:viewMoney, fitness:viewFitness,
  life:viewLife, calendar:viewCalendar, settings:viewSettings };

// render() re-runs the CURRENT view's markup in place -- it's called both
// by go() on a real tab switch AND by ~40 other sites that just need the
// DOM to reflect a state change without navigating anywhere (ticking a
// chore, closing a sheet, clearing filters, calendar nav, and -- the one
// that actually matters here -- ensureReminderConfig()/ensureActionsUsage()
// calling it a second time, unprompted, once their async fetch resolves
// after Settings has already finished its first render). Scrolling back to
// the top belongs to the FIRST kind (a fresh page), not the second (you're
// still looking at the same list, just updated) -- so it lives in go()
// only, not here. It used to live here, unconditionally, which is what
// singled out Settings for the "nav bar stuck raised" report: every other
// tab renders once and is done, but Settings' two lazy-loaded sections
// each force a second, unsolicited render shortly after load, and each one
// used to snap #app.scrollTop back to 0 with no user gesture behind it --
// on iOS Safari, a scroll position landing back at 0 is also what tells
// Safari to re-expand its address-bar chrome, undoing whatever collapse
// the user's own scroll had already triggered. Moving the reset into go()
// only fixes the actual asymmetry, rather than papering over it with a
// slower CSS transition (see #app/nav's transition above -- still worth
// keeping for whatever genuine dvh recalculation remains, just not the
// main cause).
// Preserving the actively-focused field across the innerHTML swap below is
// what actually fixed the notification-deadzone field "not saving" --
// ensureReminderConfig()/ensureActionsUsage() (see the comment above) each
// force an unprompted render() once their own fetch resolves, and that's
// completely unrelated to the Schedule section a user might be mid-typing
// in at that exact moment (Usage's fetch has nothing to do with Schedule,
// and vice versa) -- but a bare innerHTML replace doesn't know that, it
// just wipes whatever was typed and rebuilds every input from REMINDER_CFG's
// last-SAVED state, silently, with no error. The number went in fine; it
// just never survived to the tap on "Save schedule" if anything else in
// the app happened to re-render first. Every other direct-in-view text
// input (not inside a sheet -- render() never touches #sheetBody, so
// nothing there was ever exposed to this) gets the same protection for
// free, since this only cares about "whatever's currently focused," not
// which field it is: Settings' Connection/Voice-updates/Notifications
// fields (an in-progress access token is a worse thing to silently lose
// than a deadzone number) and Talk's dictation textarea included.
//
// [data-persist-toggle] elements (currently just the Schedule day cards'
// "Work hours apply" switch) get the same treatment for their on/off
// state, restored by id after the swap. This is safe SPECIFICALLY because
// toggleOnOffBtn() never calls render() itself -- it's a bare class/text
// flip -- so by construction, any render() that redraws one of these
// buttons is unrelated to a click on that same button, exactly like the
// focused-field case above. That does NOT generalize to chip rows
// (chipRow()/pick()) or the chore-tick/task-tick buttons elsewhere: those
// DO call render() as part of the very same click that changes their .on
// state (a filter chip, a completed task), so blindly restoring "what was
// .on before" there would fight the legitimate change that click just
// made -- e.g. re-checking a task the user just unchecked, or showing two
// mutually-exclusive filter chips selected at once. All of those already
// live inside sheets anyway (render() never touches them) except the chore
// filter chips, which are already state-backed by CHORE_FILTER and so
// don't need this. Mark a future direct-in-view toggle with
// data-persist-toggle only if it shares the same never-triggers-its-own-
// render property this one does.
function preservedFormState(fn){
  const appEl = $('#app');
  const active = appEl && appEl.contains(document.activeElement) ? document.activeElement : null;
  const id = active && active.id;
  const value = active && 'value' in active ? active.value : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  const toggles = appEl
    ? Array.from(appEl.querySelectorAll('[data-persist-toggle]')).map(el => ({id: el.id, on: el.classList.contains('on')}))
    : [];

  fn();

  for(const t of toggles){
    if(!t.id) continue;
    const el = document.getElementById(t.id);
    if(!el) continue;
    el.classList.toggle('on', t.on);
    el.textContent = t.on ? 'On' : 'Off';
  }
  if(!id) return;
  const restored = document.getElementById(id);
  if(!restored) return;
  if(value !== null) restored.value = value;
  restored.focus();
  if(selStart !== null && restored.setSelectionRange){
    try { restored.setSelectionRange(selStart, selEnd); } catch(e){ /* not a text-selectable input type */ }
  }
}

function render(){
  preservedFormState(() => {
    GOALREFS = [];
    ACHIEVEMENTREFS = [];
    CHOREREFS = [];

    DAYREFS = [];

  });

}

/* ============================ sheets ============================ */

// .locked survives render()'s innerHTML swap (that only replaces #app's
// children, not the element itself), so the page behind a sheet stays
// non-scrollable across any re-render that happens while it's open.
function openSheet(html){ $('#sheetBody').innerHTML = `<div class="handle"></div>` + html; $('#sheet').classList.add('on'); $('#app').classList.add('locked'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#app').classList.remove('locked'); }
// Tapping the backdrop goes through the same "did you mean to lose this?"
// gate as the swipe gesture below, instead of silently discarding.
$('#sheet').addEventListener('click', e => { if(e.target.id === 'sheet') attemptCloseSheet(); });

/* ============================ swipe-down-to-close sheets ============================ */
// A subwindow (the bottom sheet — e.g. what "Log expense" opens) can be
// dragged closed from its handle/header, same gesture as the pull-to-refresh
// above. Releasing past the trigger doesn't close it outright: if anything
// meaningful was typed, it asks to Save or Discard first so a swipe never
// silently loses an entry — same "bad signal must not lose an entry"
// principle as everything else that writes to the vault.
const SHEET_CLOSE_TRIGGER = 90, SHEET_CLOSE_MAX = 220, SHEET_CLOSE_DAMP = 0.6;
let sheetDragStartY = 0, sheetPulling = false, sheetDragging = false;

const sheetPanel = () => $('#sheetBody');

function setSheetDrag(px){
  const p = sheetPanel(); if(!p) return;
  p.style.transform = px ? `translateY(${px}px)` : '';
}
function settleSheetDrag(px){
  const p = sheetPanel(); if(!p) return;
  p.style.transition = 'transform .2s ease';
  setSheetDrag(px);
  setTimeout(() => { p.style.transition = ''; }, 220);
}

document.addEventListener('touchstart', e => {
  if(!$('#sheet').classList.contains('on') || $('#closeConfirm').classList.contains('on')) return;
  const p = sheetPanel();
  if(!p || p.scrollTop > 0 || e.touches.length !== 1) return;
  const touchY = e.touches[0].clientY;
  // Only the handle/header ~80px starts a drag, so scrolling further down a
  // long form (metrics, check-in) still works normally.
  if(touchY - p.getBoundingClientRect().top > 80) return;
  sheetDragStartY = touchY; sheetPulling = true; sheetDragging = false;
}, {passive:true});

document.addEventListener('touchmove', e => {
  if(!sheetPulling) return;
  const p = sheetPanel();
  if(!p || p.scrollTop > 0){ sheetPulling = false; if(sheetDragging){ sheetDragging = false; settleSheetDrag(0); } return; }
  const dy = Math.max(0, e.touches[0].clientY - sheetDragStartY);
  if(dy === 0) return;
  sheetDragging = true;
  setSheetDrag(Math.min(SHEET_CLOSE_MAX, dy * SHEET_CLOSE_DAMP));
}, {passive:true});

document.addEventListener('touchend', () => {
  if(!sheetPulling) return;
  sheetPulling = false;
  if(!sheetDragging) return;
  sheetDragging = false;
  const p = sheetPanel();
  const m = p ? p.style.transform.match(/-?\d+\.?\d*/) : null;
  const dist = m ? parseFloat(m[0]) : 0;
  if(dist >= SHEET_CLOSE_TRIGGER) attemptCloseSheet();
  else settleSheetDrag(0);
});
document.addEventListener('touchcancel', () => { sheetPulling = false; sheetDragging = false; settleSheetDrag(0); });

function sheetHasInput(){

    if((f.value || '').trim()) return true;

}

/* ---- generic collapsible section ---- */
// Open/closed state lives outside render() (same pattern as CAL_MODE) so it
// survives the full innerHTML rebuild every render() does. Keyed by a caller
// -chosen string, shared across settings sections, chore categories, and the
// Schedule tab's seven per-day cards. Settings sections start unseeded
// (closed); the Mon-Fri day cards are seeded open below so the common case
// doesn't hide anything on first view. Chore category groups (chorecat:*)
// deliberately are NOT seeded -- they start collapsed, since the truly
// urgent items already live in the always-open Overdue bucket above them
// (see viewChores()); opts.forceOpen on collapsible() is what makes a
// collapsed category pop back open when it still has a filter match, so
// filtering never hides a result behind a closed section.
let OPEN_SECTIONS = new Set(['sch_day_1', 'sch_day_2', 'sch_day_3', 'sch_day_4', 'sch_day_5', 'todayfreq:daily']);
function toggleSection(key){
  OPEN_SECTIONS.has(key) ? OPEN_SECTIONS.delete(key) : OPEN_SECTIONS.add(key);
  render();
}
function collapsible(key, title, bodyHtml, opts={}){
  // forceOpen doesn't touch OPEN_SECTIONS -- it's a display-only override
  // (see the comment above) so the real collapsed/open state a user chose
  // is still there once whatever forced it open (a filter) goes away.
  const open = OPEN_SECTIONS.has(key) || !!opts.forceOpen;
  const sub = opts.subtitle ? `<span class="t2">${esc(opts.subtitle)}</span>` : '';
  return `<div class="collapse ${open?'open':''}">
    <button class="collapse-head" onclick="toggleSection('${key}')">
      <span><span class="t">${esc(title)}</span>${sub}</span>
      <span class="chev">▸</span>
    </button>
    <div class="collapse-body">${bodyHtml}</div>
  </div>`;
}

}

  document.querySelectorAll('#'+id+' .chip').forEach(c => c.classList.remove('on'));

/* ---- chores (recurring and one-time -- "the object is a chore, meaning
   it can be updated to recur", CLAUDE.md #25) ---- */

// Draft state for the one Add/Edit Chore sheet, shared by every entry
// point on the Chores tab ("Add a chore", "Add a task", tap-a-chore,
// tap-a-task) -- kept outside the DOM (like PENDING/CHAT elsewhere in this
// file) because renderChoreSheet() rebuilds the whole sheet from scratch
// on every structural change (Repeats toggle, notif row add/remove/kind-
// change), the same way toggleOp() re-renders the whole page rather than
// patching one node.
let CHORE_DRAFT = null;

function blankChoreDraft(recur){
  return { path:'', origRecur:false, text:'', category:'home', due_recur: recur || '',
    due_date: todayISO(), due_day:'', due_weekday:'', due_every_days:'',
    times_per_period:'1', area:'', pet:'', due_time:'', notifications:[] };
}

// c is either a CHOREREFS entry (recurring, carries .name) or a
// chores.tasks/tasks_done entry (one-time, carries .text) -- both share
// enough of the same shape (see build_summary.py's chores "base" dict)
// that one mapping handles either. origRecur is captured once here, not
// re-derived from the live (editable) due_recur below -- it's what decides
// whether the Name field and the Remove-vs-Delete button reflect the
// note's persisted identity, which shouldn't flicker just because the
// person is mid-way through toggling Repeats before saving.
function choreToDraft(c){
  const wasRecur = !!c.due_recur;
  return {
    path: c.path || '', origRecur: wasRecur,
    text: wasRecur ? (c.name || '') : (c.text || c.name || ''),
    category: c.category || 'home',
    due_recur: c.due_recur || '', due_date: c.due_date || todayISO(),
    due_day: c.due_day != null ? String(c.due_day) : '',
    due_weekday: c.due_weekday != null ? String(c.due_weekday) : '',
    due_every_days: c.due_every_days ? String(c.due_every_days) : '',
    times_per_period: c.times_per_period != null ? String(c.times_per_period) : '1',
    area: c.area || '', pet: c.pet || '', due_time: c.due_time || '',
    notifications: parseNotifications(c.notifications),
  };
}

function sheetAddChore(recur){
  CHORE_DRAFT = blankChoreDraft(recur);
  renderChoreSheet();
}

// Recurring chores, reached from the Chores tab (CHOREREFS, same ref-array
// pattern as every other list-by-index sheet in this file).

// Only a one-time item's title is editable here (see choreToDraft/the
// disabled input above) -- a recurring chore's displayed name is always
// its filename, so text is never patched back for one.
function choreChanges(d, category){
  const changes = {
    category,
    due_recur: d.due_recur,
    due_date: d.due_recur === '' ? (d.due_date || todayISO()) : '',
    due_day: d.due_recur === 'monthly' ? d.due_day : '',
    due_weekday: d.due_recur === 'weekly' ? d.due_weekday : '',
    due_every_days: d.due_recur === 'every_n_days' ? d.due_every_days : '',
    times_per_period: d.due_recur ? (d.times_per_period || 1) : '',
    area: d.area, pet: d.pet, due_time: d.due_time,
    notifications: `[${(d.notifications||[]).map(formatNotificationToken).join(', ')}]`,
  };
  if(!d.origRecur) changes.text = d.text;
  return changes;
}

async function submitChore(btn){
  const d = CHORE_DRAFT;
  const text = (d.text || '').trim();
  if(!text) return toast('Give it a name');
  if(d.due_recur === 'monthly'){
    const day = parseInt(d.due_day, 10);
    if(!day || day < 1 || day > 31) return toast('Day of month must be 1-31');
  }
  if(d.due_recur === 'weekly' && d.due_weekday === ''){
    return toast('Pick a day of the week');
  }
  if(d.due_recur === 'every_n_days'){
    const every = parseInt(d.due_every_days, 10);
    if(!every || every < 1) return toast('Give a number of days');
  }
  // Read once, used for both the write and the local bump below -- the
  // category chip only lives in the DOM (see chipRow/picked), it was never
  // written back into CHORE_DRAFT the way a plain input's oninput does.
  // saveChore() used to read d.category directly here, which meant a new
  // chore/task always saved under whatever the draft started as (Home)
  // no matter which chip was actually tapped.
  const category = picked('ch_cat') || 'home';
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = d.path
      ? await updateChore({path:d.path, name:text}, choreChanges(d, category))
      : await saveChore({...d, name: text, category});
    bumpChoreDraft(d, text, category);
    closeSheet(); render();
    toast(r === 'queued' ? 'Saved on device — will upload when online' : (d.path ? `${text} updated` : `Added ${text}`));
    setTimeout(() => refresh(true), 1500);
  } catch(e){ toast('Failed: ' + e.message); btn.disabled = false; btn.textContent = 'Save'; }
}

async function submitRemoveChoreDraft(){
  const d = CHORE_DRAFT;
  try {
    // Retired, not deleted — active:false is the template's own documented
    // way to drop a chore from view without losing its streak history.
    const r = await updateChore({path:d.path, name:d.text}, { active: false });
    bump(dd => {
      dd.chores.all = (dd.chores.all||[]).filter(x => x.path !== d.path);
      dd.chores.due = (dd.chores.due||[]).filter(x => x.path !== d.path);
      dd.chores.overdue = (dd.chores.overdue||[]).filter(x => x.path !== d.path);
      dd.chores.due_count = (dd.chores.due||[]).length;
      dd.chores.overdue_count = (dd.chores.overdue||[]).length;
    });
    closeSheet(); render();
    toast(r === 'queued' ? 'Saved on device' : `${d.text} removed`);
  } catch(e){ toast('Failed: ' + e.message); }
}

async function submitDeleteDueChore(){
  const d = CHORE_DRAFT;
  try {
    await deleteDueChore({path:d.path, text:d.text});
    bump(dd => {
      dd.chores.tasks = (dd.chores.tasks||[]).filter(x => x.path !== d.path);
      dd.chores.tasks_done = (dd.chores.tasks_done||[]).filter(x => x.path !== d.path);
    });
    closeSheet(); render();
    toast('Deleted');
  } catch(e){ toast('Failed: ' + e.message); }
}

/* ============================ push ============================ */

function urlB64ToUint8(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const b = (base64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(b), c => c.charCodeAt(0));
}

async function enablePush(){
  const key = val('s_vapid') || cfg().vapid;
  if(!key) return toast('Paste your VAPID public key first');
  saveCfg({ vapid: key });
  if(!('serviceWorker' in navigator) || !('PushManager' in window))
    return toast('This browser cannot do push. On iPhone, install to the home screen first.');
  try {
    const reg = await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if(perm !== 'granted') return toast('Notifications not allowed');
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(key) });
    const path = vpath('90 System/push/subscriptions.json');
    let list = [], sha;
    const cur = await getFile(path);
    if(cur){ try { list = JSON.parse(cur.text); } catch(e){ list = []; } sha = cur.sha; }
    const j = sub.toJSON();
    if(!list.some(s => s.endpoint === j.endpoint)) list.push(j);
    await putFile(path, JSON.stringify(list, null, 2) + '\n', 'Register push device', sha);
    toast('Notifications on — reminders will arrive on schedule');
  } catch(e){ toast('Push failed: ' + e.message); }
}

async function disablePush(){
  if(!('serviceWorker' in navigator)) return toast('Nothing to disable here.');
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return toast('Notifications were not enabled on this device.');
    const endpoint = sub.endpoint;
    await sub.unsubscribe();
    try {
      const path = vpath('90 System/push/subscriptions.json');
      const cur = await getFile(path);
      if(cur){
        let list = [];
        try { list = JSON.parse(cur.text); } catch(e){ list = []; }
        const next = list.filter(s => s.endpoint !== endpoint);
        if(next.length !== list.length){
          await putFile(path, JSON.stringify(next, null, 2) + '\n', 'Unregister push device', cur.sha);
        }
      }
    } catch(e){ /* unsubscribed locally regardless; a dead endpoint prunes itself server-side on the next send */ }
    toast('Notifications off on this device');
  } catch(e){ toast('Failed: ' + e.message); }
}

/* ============================ pull to refresh ============================ */

(function(){
  const TRIGGER = 68, MAX = 110, DAMP = 0.45;
  const app = $('#app'), ind = $('#pull');
  let startY = 0, pulling = false, dragging = false, busy = false;

  const atTop = () => app.scrollTop <= 0; // #app is the scrolling element now, not window

  function setDist(px){
    app.style.transform = px ? `translateY(${px}px)` : '';
    app.classList.toggle('pulling', px > 0);
    ind.style.height = px + 'px';
    ind.classList.toggle('show', px > 10);
    ind.classList.toggle('ready', px >= TRIGGER);
  }

  function settle(px){
    app.style.transition = 'transform .2s ease'; ind.style.transition = 'height .2s ease';
    setDist(px);
    setTimeout(() => { app.style.transition = ''; ind.style.transition = ''; }, 220);
  }

  document.addEventListener('touchstart', e => {
    if(busy || $('#sheet').classList.contains('on') || e.touches.length !== 1) return;
    if(!atTop()) return;
    startY = e.touches[0].clientY; pulling = true; dragging = false;
  }, {passive:true});

  document.addEventListener('touchmove', e => {
    if(!pulling || busy) return;
    if(!atTop()){ pulling = false; if(dragging){ dragging = false; settle(0); } return; }
    const dy = Math.max(0, e.touches[0].clientY - startY);
    if(dy === 0) return;
    dragging = true;
    setDist(Math.min(MAX, dy * DAMP));
  }, {passive:true});

  async function finish(){
    pulling = false;
    if(!dragging) return;
    dragging = false;
    const wasReady = ind.classList.contains('ready');
    if(!wasReady){ settle(0); return; }
    busy = true;
    app.style.transition = 'transform .15s ease'; ind.style.transition = 'height .15s ease';
    setDist(48); ind.classList.add('spin');
    try { await refresh(true); } catch(e) { toast('Refresh failed: ' + e.message); }
    ind.classList.remove('spin');
    settle(0);
    busy = false;
  }
  document.addEventListener('touchend', finish);
  document.addEventListener('touchcancel', () => { pulling = false; dragging = false; settle(0); });
})();

/* ============================ boot ============================ */

document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
window.addEventListener('online', () => { flushQueue().then(n => { if(n) toast(`Uploaded ${n} queued entries`); render(); }); });
window.addEventListener('offline', render);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(false); });

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw failed', e));
}

DATA = cachedSummary();
render();
if(configured()) refresh(false);
</script>
</body>
</html>
